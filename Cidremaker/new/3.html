<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cider Journal v2.3</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath fill='%23d9f24b' d='M12 2l9 18H3z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============ БАЗА ============ */
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#e9e7e2; --ink:#16181d; --ink2:#5f636b; --ink3:#8b8f97;
  --glass:rgba(255,255,255,.55); --glass2:rgba(255,255,255,.34); --glass3:rgba(255,255,255,.72);
  --bord:rgba(22,24,29,.10); --bord2:rgba(22,24,29,.18);
  --acc:#141519; --acc-ink:#f4f4f2; --acid:#d9f24b; --acid-ink:#1a1c10;
  --danger:#b3372c; --warn:#a06a12; --ok:#3f7355; --info:#4e6f94;
  --r:22px; --r-s:14px;
  --sh:0 24px 60px -30px rgba(20,22,26,.28);
  --f-body:'Manrope',system-ui,'Segoe UI',sans-serif;
  --f-disp:'Unbounded','Manrope',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'Cascadia Mono',monospace;
}
html.dark{
  --bg:#131417; --ink:#ececea; --ink2:#a6a9af; --ink3:#767a82;
  --glass:rgba(30,32,37,.6); --glass2:rgba(40,42,48,.4); --glass3:rgba(38,40,46,.8);
  --bord:rgba(255,255,255,.09); --bord2:rgba(255,255,255,.16);
  --acc:#f0f0ee; --acc-ink:#16181d; --acid:#d9f24b; --acid-ink:#1a1c10;
  --danger:#e0705f; --warn:#d9a24a; --ok:#79b391; --info:#8aa9cc;
  --sh:0 24px 60px -28px rgba(0,0,0,.6);
}
html,body{height:100%}
body{
  font-family:var(--f-body); color:var(--ink); background:var(--bg);
  font-size:15px; line-height:1.45; overflow-x:hidden;
}
.bg-blob{position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
.b1{width:52vw;height:52vw;left:-14vw;top:-18vw;background:radial-gradient(circle,rgba(255,255,255,.75),transparent 65%)}
.b2{width:44vw;height:44vw;right:-12vw;top:22vh;background:radial-gradient(circle,rgba(148,152,160,.30),transparent 65%)}
.b3{width:38vw;height:38vw;left:24vw;bottom:-20vw;background:radial-gradient(circle,rgba(217,242,75,.16),transparent 60%)}
html.dark .b1{background:radial-gradient(circle,rgba(255,255,255,.06),transparent 65%)}
html.dark .b2{background:radial-gradient(circle,rgba(255,255,255,.05),transparent 65%)}
html.dark .b3{background:radial-gradient(circle,rgba(217,242,75,.06),transparent 60%)}
.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(140%);-webkit-backdrop-filter:blur(22px) saturate(140%);border:1px solid var(--bord);border-radius:var(--r);box-shadow:var(--sh)}
.glass2{background:var(--glass2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--bord);border-radius:var(--r-s)}
::selection{background:var(--acid);color:var(--acid-ink)}
a{color:var(--ink)}
h1,h2,h3{font-weight:800}
.h-big{font-family:var(--f-disp);font-size:clamp(24px,3.2vw,38px);font-weight:900;letter-spacing:-.5px}
.mono{font-family:var(--f-mono)}
.muted{color:var(--ink2)}
.small{font-size:12.5px}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.ic{width:18px;height:18px;flex:none;vertical-align:-4px}

/* ============ КАРКАС ============ */
#app{display:flex;gap:18px;padding:18px;position:relative;z-index:1;min-height:100vh}
.rail{width:74px;flex:none;align-self:flex-start;position:sticky;top:18px;padding:14px 0;display:flex;flex-direction:column;align-items:center;gap:6px;border-radius:26px}
.rail .logo{width:44px;height:44px;border-radius:14px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;margin-bottom:10px}
.rail .logo svg{width:22px;height:22px}
.rnav{display:flex;flex-direction:column;gap:6px;width:100%;align-items:center}
.rbtn{width:46px;height:46px;border-radius:15px;border:none;background:transparent;color:var(--ink2);display:grid;place-items:center;cursor:pointer;transition:.18s}
.rbtn:hover{background:var(--glass3);color:var(--ink)}
.rbtn.active{background:var(--acc);color:var(--acc-ink)}
.rbtn svg{width:20px;height:20px}
.rail .spacer{flex:1;min-height:8px}
.rail .saveline{font-size:9.5px;text-align:center;color:var(--ink2);padding:4px 6px 8px;max-width:64px;line-height:1.3}
#main{flex:1;min-width:0;padding-bottom:40px}
.page{max-width:1240px;margin:0 auto}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:8px 4px 18px}
.sub{color:var(--ink2);margin-top:4px}

/* ============ КОНТРОЛЫ ============ */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--bord2);background:var(--glass2);color:var(--ink);
  border-radius:999px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;transition:.16s;white-space:nowrap}
.btn:hover{background:var(--glass3);transform:translateY(-1px)}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:transparent}
.btn.acid{background:var(--acid);color:var(--acid-ink);border-color:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.icon{padding:9px;border-radius:12px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.in,select.in,textarea.in{font:inherit;color:var(--ink);background:var(--glass2);border:1px solid var(--bord);border-radius:12px;padding:9px 12px;width:100%;transition:.15s}
.in:focus{outline:none;border-color:var(--ink2);background:var(--glass3)}
textarea.in{resize:vertical;min-height:70px}
select.in{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 18px) 55%,calc(100% - 13px) 55%;background-size:5px 5px;background-repeat:no-repeat;padding-right:32px}
label.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:var(--ink2);letter-spacing:.02em}
label.fld > .in{font-size:14px;font-weight:500;color:var(--ink)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.fgrid .wide{grid-column:1/-1}
.chk{display:inline-flex;align-items:center;gap:8px;font-weight:600;cursor:pointer;color:var(--ink2)}
.chk input{width:16px;height:16px;accent-color:var(--ink)}
.ferr{color:var(--danger);font-size:12px;margin-top:4px;font-weight:600}
.hint{color:var(--ink2);font-size:13px}

/* ============ ЧИПЫ / СТАТУСЫ ============ */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:4px 11px;font-size:12px;font-weight:700;border:1px solid var(--bord);background:var(--glass2);white-space:nowrap}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c,#999)}
.sev-error,.sev-danger{background:rgba(179,55,44,.14);color:var(--danger);border-color:rgba(179,55,44,.35)}
.sev-warning{background:rgba(160,106,18,.13);color:var(--warn);border-color:rgba(160,106,18,.3)}
.sev-info{background:rgba(78,111,148,.13);color:var(--info);border-color:rgba(78,111,148,.3)}
.sev-ok{background:rgba(63,115,85,.13);color:var(--ok);border-color:rgba(63,115,85,.3)}
.chip.conf{background:var(--glass2)}
.chip.conf-high{color:var(--ok)} .chip.conf-medium{color:var(--warn)} .chip.conf-low,.chip.conf-orient{color:var(--info)}
.badge{font-family:var(--f-disp);font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px;background:var(--acc);color:var(--acc-ink)}
.stage-dot{width:10px;height:10px;border-radius:50%;background:var(--c,#888);display:inline-block;box-shadow:0 0 0 3px color-mix(in srgb,var(--c,#888) 25%,transparent)}

/* ============ ПАНЕЛИ / КАРТОЧКИ ============ */
.panel{padding:20px;margin-bottom:16px}
.panel h3{font-size:15px;margin-bottom:12px;letter-spacing:.02em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{padding:18px;cursor:pointer;transition:.18s;position:relative}
.card:hover{transform:translateY(-3px)}
.card h3{font-size:17px;margin:8px 0 2px}
.card .code{font-family:var(--f-mono);font-size:12px;color:var(--ink2)}
.card .stage{display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-weight:700;font-size:13.5px}
.card .meta{color:var(--ink2);font-size:12.5px;margin-top:2px}
.card .wchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.card-top{display:flex;justify-content:space-between;align-items:center}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 16px;margin-bottom:16px}
.tb-search{display:flex;align-items:center;gap:8px;flex:1;min-width:200px;color:var(--ink2)}
.tb-search input{border:none;background:transparent;font:inherit;color:var(--ink);width:100%;outline:none}
.sep{width:1px;height:26px;background:var(--bord2)}
.empty{padding:34px;text-align:center;color:var(--ink2);border:1.5px dashed var(--bord2);border-radius:var(--r-s)}

/* ============ ПАРТИЯ ============ */
.bhead{display:flex;flex-wrap:wrap;gap:14px;align-items:center;padding:16px 20px;margin:8px 0 14px}
.bhead .ttl{flex:1;min-width:220px}
.bhead h1{font-size:22px}
.bhead .facts{display:flex;gap:20px;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.bhead .facts b{color:var(--ink);font-family:var(--f-mono);font-weight:500}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px;margin-bottom:16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:1px solid transparent;background:transparent;color:var(--ink2);border-radius:999px;padding:9px 16px;font:inherit;font-weight:700;font-size:13px;cursor:pointer;white-space:nowrap;transition:.15s}
.tab:hover{background:var(--glass2);color:var(--ink)}
.tab.active{background:var(--acc);color:var(--acc-ink)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid2 > .panel{margin-bottom:0}
.statgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.stat{background:var(--glass2);border:1px solid var(--bord);border-radius:var(--r-s);padding:12px 14px}
.stat .lbl{font-size:11px;font-weight:700;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em}
.stat .val{font-family:var(--f-mono);font-size:19px;margin-top:4px}
.stat .val small{font-size:12px;color:var(--ink2)}
.warnlist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.warnlist .wi{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:10px 12px;border-radius:12px;border:1px solid var(--bord);background:var(--glass2)}
.warnlist .wi svg{margin-top:1px}
.formula{font-family:var(--f-mono);font-size:12.5px;background:var(--glass2);border:1px solid var(--bord);border-radius:10px;padding:9px 12px;margin:8px 0;overflow-x:auto;white-space:pre-wrap}
.assump{margin:8px 0 0 18px;font-size:13px;color:var(--ink2)}
.assump li{margin:3px 0}
.calc-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.calc-value{font-family:var(--f-mono);font-size:30px;margin:10px 0 2px}
.calc-value .unit{font-size:15px;color:var(--ink2)}
.rng{font-family:var(--f-mono);font-size:13px;color:var(--ink2);margin-bottom:6px}
.calc-note{font-size:13px;color:var(--ink2);margin-top:10px;border-top:1px dashed var(--bord2);padding-top:10px}
.dangerbox{background:rgba(179,55,44,.12);border:1.5px solid rgba(179,55,44,.45);color:var(--danger);border-radius:var(--r-s);padding:14px;font-weight:700;margin:12px 0;display:flex;gap:10px;align-items:flex-start}

/* ============ ТАБЛИЦЫ ============ */
.tblwrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink2);text-align:left;padding:8px 10px;border-bottom:1.5px solid var(--bord2);cursor:pointer;user-select:none;white-space:nowrap}
.tbl th.nos{cursor:default}
.tbl td{padding:8px 10px;border-bottom:1px solid var(--bord);font-family:var(--f-mono);white-space:nowrap}
.tbl td.txt{font-family:var(--f-body)}
.tbl tr:hover td{background:var(--glass2)}
.rowbtns{display:flex;gap:4px}
.ibtn{border:none;background:transparent;color:var(--ink2);cursor:pointer;padding:5px;border-radius:8px;display:inline-grid;place-items:center}
.ibtn:hover{background:var(--glass3);color:var(--ink)}
.ibtn.del:hover{color:var(--danger)}

/* ============ МОДАЛЬНЫЕ / ТОСТЫ ============ */
.mback{position:fixed;inset:0;background:rgba(15,16,20,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;z-index:100;padding:18px;overflow:auto}
.mpanel{width:min(680px,100%);padding:24px;max-height:92vh;overflow:auto;border-radius:26px}
.mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.mhead h3{font-size:18px}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:10px;z-index:200;max-width:380px}
.toast{padding:13px 16px;border-radius:16px;font-weight:600;font-size:14px;display:flex;gap:10px;align-items:flex-start;animation:tin .25s}
@keyframes tin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.toast.ok{border-left:4px solid var(--ok)} .toast.warn{border-left:4px solid var(--warn)} .toast.err{border-left:4px solid var(--danger)} .toast.info{border-left:4px solid var(--info)}

/* ============ КАЛЕНДАРЬ / TIMELINE ============ */
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calwd{text-align:center;font-size:11px;font-weight:800;color:var(--ink2);padding:6px 0;text-transform:uppercase}
.calday{min-height:86px;border-radius:14px;border:1px solid var(--bord);background:var(--glass2);padding:7px;font-size:12px}
.calday.out{opacity:.35}
.calday.today{border:2px solid var(--ink)}
.calday .dnum{font-family:var(--f-mono);font-size:12px;color:var(--ink2);margin-bottom:4px}
.ev{display:block;width:100%;text-align:left;border:none;font:inherit;font-size:11px;font-weight:700;border-radius:8px;padding:3px 7px;margin:3px 0;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.meas{background:rgba(78,111,148,.18);color:var(--info)}
.ev.op{background:rgba(160,106,18,.16);color:var(--warn)}
.ev.stage{background:rgba(63,115,85,.16);color:var(--ok)}
.tlwrap{overflow-x:auto;padding:8px}
.tlwrap svg{min-width:1000px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:11.5px;color:var(--ink2);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

/* ============ ГРАФИКИ ============ */
.chartbox svg{width:100%;height:auto;display:block}
.chart-toggles{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.minicharts{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:14px}
.mini{background:var(--glass2);border:1px solid var(--bord);border-radius:var(--r-s);padding:10px 12px}
.mini .mt{font-size:11px;font-weight:800;color:var(--ink2);text-transform:uppercase;letter-spacing:.05em;display:flex;justify-content:space-between}
.mini .mv{font-family:var(--f-mono);font-size:15px}

/* ============ ФОТО ============ */
.drop{border:2px dashed var(--bord2);border-radius:var(--r-s);padding:26px;text-align:center;color:var(--ink2);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--ink2);background:var(--glass2)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;margin-top:14px}
.ph{position:relative;border-radius:var(--r-s);overflow:hidden;border:1px solid var(--bord);background:var(--glass2);min-height:120px}
.ph img{width:100%;height:150px;object-fit:cover;display:block;cursor:zoom-in}
.ph .pc{position:absolute;top:6px;left:6px}
.ph .pdel{position:absolute;top:6px;right:6px;background:var(--glass3);border-radius:10px}
.ph .pnote{padding:7px 9px;font-size:11.5px;color:var(--ink2)}

/* ============ БАННЕР ============ */
.banner{display:flex;gap:12px;align-items:flex-start;padding:14px 18px;margin-bottom:16px;border-radius:var(--r-s);border:1px solid var(--bord2);background:var(--glass3);flex-wrap:wrap}
.banner.acid{border-color:rgba(160,106,18,.4);background:rgba(217,242,75,.25)}
html.dark .banner.acid{background:rgba(217,242,75,.10)}

/* ============ ПЕЧАТЬ ============ */
#print-root{display:none}
@media print{
  body{background:#fff;color:#000}
  .bg-blob,.rail,#toasts,.no-print{display:none!important}
  #app{display:block;padding:0}
  #main>*{display:none!important}
  #print-root{display:block!important}
  #print-root table{width:100%;border-collapse:collapse;font-size:11px}
  #print-root td,#print-root th{border:1px solid #999;padding:4px 6px}
  #print-root h1{font-size:20px} #print-root h2{font-size:15px;margin:14px 0 6px}
}

/* ============ АДАПТИВ ============ */
@media (max-width:920px){
  #app{flex-direction:column;padding:12px;gap:12px}
  .rail{width:100%;flex-direction:row;position:sticky;top:8px;padding:8px 12px;border-radius:20px;align-items:center}
  .rnav{flex-direction:row;justify-content:center}
  .rail .logo{margin:0 4px 0 0}
  .rail .saveline{max-width:120px;padding:0 8px;text-align:left}
  .grid2{grid-template-columns:1fr}
  .mpanel{padding:18px}
}
</style>
</head>
<body>
<div class="bg-blob b1"></div><div class="bg-blob b2"></div><div class="bg-blob b3"></div>
<div id="app">
  <aside class="rail glass" id="rail"></aside>
  <main id="main"></main>
</div>
<div id="modal-root"></div>
<div id="toasts" aria-live="polite"></div>
<div id="print-root"></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>
<input type="file" id="photo-file" accept="image/*" multiple hidden>

<script>
'use strict';
/* ============================================================
   CIDER JOURNAL v2.3 — локальный технологический журнал сидра
   Все расчёты — оценки. Приложение показывает формулы и
   уровень уверенности для каждой цифры.
   ============================================================ */

/* ---------- 0. КОНСТАНТЫ ---------- */
const APP_VERSION='2.3.0', SCHEMA_VERSION='2.3', LS_KEY='cider_journal_data';
const K={
  SUGAR_PER_ABV:17,        // г/л сбраживаемого сахара на 1 % об. (правило виноделия)
  CO2_PER_SUGAR:0.489,     // г CO2 на 1 г сахара (стехиометрия C6H12O6)
  CO2_SOL_20C:1.96,        // г/л CO2 на 1 bar при 20 °C (растворимость)
  CO2_TCOEF:0.023,         // температурный коэффициент растворимости, 1/°C
  REF_ALC:0.42,            // завышение показания рефрактометра, °Bx на 1 % об.
  SG_SUGAR:0.004,          // прирост SG на 1 °Bx истинного экстракта
  SG_ALC:0.0018,           // снижение SG на 1 % об.
  HYDROM_ABV:131.25,       // коэффициент ABV по паре SG (правило 131.25)
  RANGE:0.15               // полоса неопределённости ±15 %
};
const TYPES={classic:'Classic',petnat:'Pet-Nat',still:'Still',solera:'Solera'};
const STAGES=[
  {id:'plan',name:'План'},{id:'pressing',name:'Прессование'},{id:'primary',name:'Первичное брожение'},
  {id:'aging',name:'Выдержка'},{id:'prep',name:'Подготовка к розливу'},{id:'secondary',name:'Вторичная ферментация'},
  {id:'bottle_aging',name:'Выдержка после розлива'},{id:'disgorging',name:'Дегоржаж'},
  {id:'finalized',name:'Финализация'},{id:'done',name:'Готово'}
];

/* ---------- 3. МАТЕМАТИЧЕСКИЙ МОДУЛЬ (чистые функции) ---------- */
function mkResult(o){
  return Object.assign({value:null,unit:'',confidence:'orient',range:null,formula:'',
    assumptions:[],warnings:[],inputs:{},approx:true,decimals:1,danger:false,extra:{},timestamp:iso()},o);
}
const brixToSG=b=>1+(b/(258.6-((b/258.2)*227.1)));
const sgToBrix=sg=>((182.4601*sg-775.6821)*sg+1262.7794)*sg-669.5622;
const sgToOe=sg=>(sg-1)*1000;
const sugarFromBrix=(b,sg)=>b*10*(sg||1); // °Bx — % масс.; г/л ≈ Bx×10×плотность
const kSol=T=>K.CO2_SOL_20C*Math.exp(-K.CO2_TCOEF*((T==null?20:T)-20)); // г/л CO2 на bar

function calculateABV(i){
  const og=num(i.ogSG),fg=num(i.fgSG);
  const inp={og,fg};const w=[];
  if(og==null||fg==null)return mkResult({value:null,hint:'Нужны OG и FG (SG)',warnings:w,inputs:inp});
  if(og<=fg)w.push({level:'warning',text:'FG ≥ OG — брожение не видно или данные некорректны'});
  const v=(og-fg)*K.HYDROM_ABV;
  return mkResult({value:v,unit:'% об.',confidence:'high',range:{min:v*0.93,max:v*1.07},
    formula:'ABV = (OG − FG) × 131.25',inputs:inp,warnings:w,decimals:1,
    assumptions:['Эмпирическое правило для вин/сидра; не учитывает экстракт']});
}
function calculatePotentialABV(i){
  const bx=num(i.brix),sg=num(i.sg);
  const inp={brix:bx,sg};const w=[],a=[];
  if(bx==null)return mkResult({value:null,hint:'Нужен Brix исходного сока',warnings:w,inputs:inp});
  if(bx<0||bx>45)w.push({level:'error',text:'Brix вне диапазона 0–45'});
  const sugar=sugarFromBrix(bx,sg??1);
  const v=sugar/K.SUGAR_PER_ABV;
  a.push('Весь растворимый экстракт принят за сбраживаемый сахар — для яблочного сока оценка ЗАВЫШЕНА (сорбит и кислоты не сбраживаются)');
  a.push('Принято '+K.SUGAR_PER_ABV+' г/л сахара на 1 % об. ABV');
  if(sg==null)a.push('Плотность не задана — принято SG=1.0');
  return mkResult({value:v,unit:'% об.',confidence:'orient',range:{min:v*0.82,max:v*1.05},
    formula:'сахар ≈ Brix × 10 × SG; ABV ≈ сахар / '+K.SUGAR_PER_ABV,inputs:inp,assumptions:a,warnings:w,decimals:1});
}
function calculateResidualSugar(i){
  const rb=num(i.rb),sg=num(i.sg),abv=num(i.abv),bxi=num(i.brixInitial);
  const ff=num(i.fermentFrac)??0.9;
  const inp={rb,sg,abv,brixInitial:bxi};const w=[],a=[];
  const E2RS=(E)=>E*10*(sg??1); // °Bx → г/л экстракта (как сахар)
  if(rb==null&&sg==null)return mkResult({value:null,hint:'Нет данных измерений (нужен рефрактометр и/или ареометр)',inputs:inp,warnings:w});
  // Путь 1: RB + SG + начальный Brix
  if(rb!=null&&sg!=null&&bxi!=null){
    const sg0=brixToSG(bxi);const A=(sg0-sg)*K.HYDROM_ABV;
    const E=rb-K.REF_ALC*A;const rs=E2RS(E);
    const A2=(0.004*rb-(sg-1))/0.00348;
    if(Math.abs(A-A2)>1.5)w.push({level:'warning',text:'Оценка ABV по паре приборов ('+fmtN(A2,1)+'%) расходится с оценкой по SG ('+fmtN(A,1)+'%) — проверьте исходные данные'});
    a.push('Истинный экстракт: E = RB − '+K.REF_ALC+' × ABV');
    a.push('ABV по снижению плотности от начального Brix');
    return mkResult({value:rs,unit:'г/л',confidence:'high',range:{min:rs*0.9,max:rs*1.1},
      formula:'ABV=(SG₀−SG)×131.25; E=RB−'+K.REF_ALC+'·ABV; RS≈E×10×SG',
      inputs:inp,assumptions:a,warnings:w,decimals:1,
      extra:{trueBrix:E,abvEst:A,path:'RB+SG+начальный Brix',fermentable:rs*ff}});
  }
  // Путь 2: RB + SG
  if(rb!=null&&sg!=null){
    const A=(0.004*rb-(sg-1))/0.00348;
    if(A<0)w.push({level:'warning',text:'Модель даёт ABV<0 — вероятно, брожение ещё не началось или приборы не откалиброваны'});
    const E=rb-K.REF_ALC*Math.max(A,0);const rs=E2RS(E);
    a.push('Система двух уравнений: RB = E + '+K.REF_ALC+'·A; SG = 1 + '+K.SG_SUGAR+'·E − '+K.SG_ALC+'·A');
    return mkResult({value:rs,unit:'г/л',confidence:'medium',range:{min:rs*0.85,max:rs*1.15},
      formula:'A=(0.004·RB−(SG−1))/0.00348; E=RB−'+K.REF_ALC+'·A; RS≈E×10×SG',
      inputs:inp,assumptions:a,warnings:w,decimals:1,
      extra:{trueBrix:E,abvEst:A,path:'RB+SG (без OG)',fermentable:rs*ff}});
  }
  // Путь 3: RB + ABV
  if(rb!=null&&abv!=null){
    const E=rb-K.REF_ALC*abv;const rs=E2RS(E);
    a.push('Истинный экстракт: E = RB − '+K.REF_ALC+' × ABV (коэффициент разбухания показания от спирта)');
    if(sg==null)w.push({level:'info',text:'SG отсутствует — добавьте ареометр для повышения точности'});
    return mkResult({value:rs,unit:'г/л',confidence:'medium',range:{min:rs*0.85,max:rs*1.15},
      formula:'E=RB−'+K.REF_ALC+'·ABV; RS≈E×10',inputs:inp,assumptions:a,warnings:w,decimals:1,
      extra:{trueBrix:E,abvEst:abv,path:'RB+ABV',fermentable:rs*ff}});
  }
  // Путь 5: SG + ABV (без RB)
  if(sg!=null&&abv!=null){
    const E=(sg-1+K.SG_ALC*abv)/K.SG_SUGAR;const rs=E2RS(E);
    a.push('Обратная модель плотности: E = (SG − 1 + '+K.SG_ALC+'·ABV) / '+K.SG_SUGAR);
    return mkResult({value:rs,unit:'г/л',confidence:'medium',range:{min:rs*0.85,max:rs*1.15},
      formula:'E=(SG−1+'+K.SG_ALC+'·ABV)/'+K.SG_SUGAR+'; RS≈E×10×SG',inputs:inp,assumptions:a,warnings:w,decimals:1,
      extra:{trueBrix:E,abvEst:abv,path:'SG+ABV',fermentable:rs*ff}});
  }
  // Путь 4: только RB
  if(rb!=null){
    const rs=E2RS(rb);
    w.push({level:'error',text:'Коррекция невозможна: нет ни SG, ни ABV, ни начального Brix. После начала ферментации показание рефрактометра ЗАВЫШАЕТ сахар'});
    a.push('Без коррекции: RS ≈ RB×10 — валидно только ДО начала брожения');
    return mkResult({value:rs,unit:'г/л',confidence:'low',range:{min:rs*0.5,max:rs*1.3},
      formula:'RS ≈ RB × 10 (БЕЗ коррекции на спирт)',inputs:inp,assumptions:a,warnings:w,decimals:0,
      extra:{trueBrix:null,abvEst:null,path:'RB без коррекции',fermentable:rs*ff}});
  }
  return mkResult({value:null,hint:'Недостаточно данных: нужен SG + ABV или RB',inputs:inp,warnings:w});
}
function calculateRefractometerCorrection(i){
  const rb=num(i.rb),sg=num(i.sg),abv=num(i.abv),temp=num(i.temp);
  const base=calculateResidualSugar(i);
  const needs=[];
  if(sg==null)needs.push('+ SG (ареометр)');
  if(abv==null&&num(i.brixInitial)==null)needs.push('+ ABV или начальный Brix');
  if(temp==null)needs.push('+ Temperature');
  const reasonMap={
    'RB+SG+начальный Brix':'введены рефрактометр + ареометр + начальный Brix — использована модель снижения плотности',
    'RB+SG (без OG)':'введены рефрактометр + ареометр — решена система двух уравнений (без OG)',
    'RB+ABV':'введены рефрактометр + ABV, но отсутствует SG — коррекция по коэффициенту влияния спирта',
    'SG+ABV':'введены ареометр + ABV без рефрактометра',
    'RB без коррекции':'данных для коррекции недостаточно — показание не скорректировано'
  };
  return {raw:rb,sg,abv,result:base,needs,reason:reasonMap[base.extra?.path]||'',
    enoughData:base.value!=null&&base.confidence!=='low'};
}
function calculatePressure(i){
  const s=num(i.sugarGL),T=num(i.temp)??20,resid=num(i.residualCO2)||0;
  const w=[],a=[];
  if(s==null)return mkResult({value:null,hint:'Нужен сахар г/л',inputs:{s,T,resid},warnings:w});
  if(i.temp==null)w.push({level:'info',text:'Температура не задана — принята 20 °C'});
  const k=kSol(T);const v=(s*K.CO2_PER_SUGAR+resid)/k;
  a.push('Растворимость CO₂: '+fmtN(k,2)+' г/л на bar при '+fmtN(T,0)+' °C (экспоненциальная модель от 1.96 г/л/bar при 20 °C)');
  a.push('Стехиометрия: 0.489 г CO₂ на 1 г сахара; головное пространство и остаточный CO₂ первичного брожения не учтены детально');
  const r={min:v*(1-K.RANGE),max:v*(1+K.RANGE)};
  const lim=num(i.bottleLimit);
  if(lim!=null&&v>lim)return mkResult({value:v,unit:'bar',confidence:'medium',range:r,formula:'P ≈ (сахар×0.489 + CO₂ост) / k(T)',
    inputs:{s,T,resid},assumptions:a,warnings:w,danger:true,decimals:1,
    extra:{bottleLimit:lim,headroom:lim-v}});
  return mkResult({value:v,unit:'bar',confidence:'medium',range:r,formula:'P ≈ (сахар×0.489 + CO₂ост) / k(T)',
    inputs:{s,T,resid},assumptions:a,warnings:w,decimals:1});
}
function calculateTargetSugar(i){
  const P=num(i.targetBar),T=num(i.temp)??20,resid=num(i.residualCO2)||0;
  const w=[],a=[];
  if(P==null||P<0)return mkResult({value:null,hint:'Нужно целевое давление (bar ≥ 0)',inputs:{P,T,resid},warnings:w});
  if(i.temp==null)w.push({level:'info',text:'Температура не задана — принята 20 °C'});
  const k=kSol(T);const v=Math.max(0,(P*k-resid)/K.CO2_PER_SUGAR);
  a.push('Правило «4 г/л на 1 bar» — частный случай при 20 °C; при '+fmtN(T,0)+' °C использован коэффициент '+fmtN(K.CO2_PER_SUGAR/k,2)+' г/л на bar');
  a.push('Не учтены: остаточный CO₂ активного брожения (если не введён), потери CO₂, головное пространство');
  return mkResult({value:v,unit:'г/л',confidence:'medium',range:{min:v*(1-K.RANGE),max:v*(1+K.RANGE)},
    formula:'сахар ≈ (P×k(T) − CO₂ост) / 0.489',inputs:{P,T,resid},assumptions:a,warnings:w,decimals:1});
}
function calculateTargetRefractometer(i){
  const s=num(i.sugarGL),abv=num(i.abv),ff=num(i.fermentFrac)??0.9;
  const w=[],a=[];
  if(s==null)return mkResult({value:null,hint:'Нужен сахар г/л',inputs:{s,abv},warnings:w});
  const E=s/(ff*10);const A=abv??0;
  if(abv==null)w.push({level:'warning',text:'ABV неизвестен — расчёт показания рефрактометра без поправки на спирт будет занижен'});
  const v=E+K.REF_ALC*A;
  a.push('Ожидаемое показание = истинный экстракт + '+K.REF_ALC+' × ABV (спирт завышает показание)');
  a.push('Экстракт пересчитан из сбраживаемого сахара с долей сбраживаемого экстракта '+fmtN(ff*100,0)+'%');
  return mkResult({value:v,unit:'°Bx',confidence:'low',range:{min:v*0.85,max:v*1.15},
    formula:'RB_ожид ≈ сахар/(ff×10) + '+K.REF_ALC+'×ABV',inputs:{s,abv,ff},assumptions:a,warnings:w,decimals:1});
}
function calculateTargetHydrometer(i){
  const s=num(i.sugarGL),abv=num(i.abv),ff=num(i.fermentFrac)??0.9;
  const w=[],a=[];
  if(s==null)return mkResult({value:null,hint:'Нужен сахар г/л',inputs:{s,abv},warnings:w});
  const E=s/(ff*10);const A=abv??0;
  const sg=1+K.SG_SUGAR*E-K.SG_ALC*A;
  if(abv==null)w.push({level:'warning',text:'ABV неизвестен — принято ABV=0, ожидаемый SG будет завышен'});
  a.push('SG ≈ 1 + '+K.SG_SUGAR+'×E − '+K.SG_ALC+'×ABV (линейная аппроксимация влияния сахара и спирта)');
  return mkResult({value:sg,unit:'SG',confidence:'low',range:{min:sg-0.003,max:sg+0.003},
    formula:'SG_ожид ≈ 1 + '+K.SG_SUGAR+'·E − '+K.SG_ALC+'·ABV',inputs:{s,abv,ff},assumptions:a,warnings:w,decimals:3,
    extra:{oe:sgToOe(sg)}});
}
function compareInstruments(i){
  const rb=num(i.rb),sg=num(i.sg),abv=num(i.abv);
  const w=[];
  if(rb==null||sg==null||abv==null)return mkResult({value:null,hint:'Для сравнения методов нужны одновременно RB + SG + ABV',inputs:{rb,sg,abv},warnings:w});
  const sRB=(rb-K.REF_ALC*abv)*10*(sg||1);
  const ESG=(sg-1+K.SG_ALC*abv)/K.SG_SUGAR;const sSG=ESG*10*sg;
  const avg=(sRB+sSG)/2;const div=avg>0?Math.abs(sRB-sSG)/avg*100:0;
  if(div>20)w.push({level:'warning',text:'Значения отличаются на '+fmtN(div,0)+'%. Проверьте: температуру; калибровку приборов; корректность ABV; время отбора пробы.'});
  return mkResult({value:div,unit:'%',confidence:'medium',formula:'RB-путь: (RB−0.42·ABV)×10×SG; SG-путь: ((SG−1+0.0018·ABV)/0.004)×10×SG',
    inputs:{rb,sg,abv},warnings:w,decimals:1,
    extra:{sRB,sSG,agree:div<=20}});
}
function calculatePetNat(i){
  const target=num(i.targetBar),T=num(i.temp)??20,resid=num(i.residualCO2)||0,ff=num(i.fermentFrac)??0.9;
  const corr=calculateResidualSugar(i);
  const w=[...corr.warnings];
  const a=[...corr.assumptions];
  a.push('Доля сбраживаемого экстракта принята '+fmtN(ff*100,0)+'% — для яблочного сока остаток в основном сбраживаем (фруктоза), но sorbit не сбраживается');
  const snow=corr.value!=null?corr.value*ff:null; // сбраживаемый сахар сейчас, г/л
  const tgt=calculateTargetSugar({targetBar:target,temp:T,residualCO2:resid});
  const pnow=snow!=null?calculatePressure({sugarGL:snow,temp:T,residualCO2:resid,bottleLimit:i.bottleLimit}):null;
  let delta=null,deltaTxt='';
  if(snow!=null&&tgt.value!=null){delta=tgt.value-snow;
    deltaTxt=delta>0?('нужно добродить ещё ≈'+fmtN(delta,1)+' г/л сахара до цели')
      :('сахара уже на ≈'+fmtN(-delta,1)+' г/л БОЛЬШЕ цели — давление превысит целевое');}
  const tgtRB=calculateTargetRefractometer({sugarGL:tgt.value,abv:num(i.abv),fermentFrac:ff});
  const tgtSG=calculateTargetHydrometer({sugarGL:tgt.value,abv:num(i.abv),fermentFrac:ff});
  const cmp=(num(i.rb)!=null&&num(i.sg)!=null&&num(i.abv)!=null)?compareInstruments(i):null;
  const conf=(corr.confidence==='high'&&tgt)?'medium':'low';
  return mkResult({value:pnow?pnow.value:null,unit:'bar',confidence:conf,
    range:pnow?pnow.range:null,formula:'см. разделы ниже; P=(сахар×0.489+CO₂ост)/k(T)',
    inputs:{target,T,resid,ff,rb:num(i.rb),sg:num(i.sg),abv:num(i.abv)},assumptions:a,warnings:w,
    decimals:1,danger:!!(pnow&&pnow.danger),
    extra:{corr,snow,tgt,delta,deltaTxt,tgtRB,tgtSG,cmp,pnow,
      atm:num(i.targetBar)!=null?num(i.targetBar)*0.98692266:null}});
}
function calculateLiqueur(i){
  const v=num(i.volumeL),tRS=num(i.targetRS),cRS=num(i.currentRS)??0,c=num(i.concGL),gv=num(i.givenVolML),btl=num(i.bottles);
  const w=[],a=[];
  if(v==null||v<=0)return mkResult({value:null,hint:'Укажите объём партии (>0)',inputs:{v,tRS,cRS,c},warnings:w});
  if(c==null||c<=0)return mkResult({value:null,hint:'Укажите концентрацию ликёра г/л (>0)',inputs:{v,tRS,cRS,c},warnings:w});
  const deficit=(tRS!=null)?(tRS-cRS):null;
  if(deficit!=null&&deficit<0)w.push({level:'warning',text:'Текущий сахар уже выше целевого — потребность принята 0 г'});
  const need=Math.max(0,deficit??0)*v;
  const volL=need/c;
  const perBtl=(btl&&btl>0)?volL*1000/btl:null;
  let actual=null,achieved=null;
  if(gv!=null&&gv>0){actual=gv/1000*c;achieved=cRS+actual/v;}
  a.push('Единицы не смешиваются: потребность в граммах, концентрация в г/л, объём ликёра в литрах');
  return mkResult({value:volL,unit:'л ликёра',confidence:'high',range:null,
    formula:'сахар_г=(Целевой−Текущий)×V; V_ликёра=сахар_г / конц_г⁄л',inputs:{v,tRS,cRS,c,gv,btl},
    assumptions:a,warnings:w,decimals:0,
    extra:{need,perBtl,actual,achieved}});
}
function calculateSolera(tank){
  const ops=[...(tank.operations||[])].sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  let vol=num(tank.initialVolume)||0,F=1,M=0,cycles=0;
  let last=num(tank.initialVolume)!=null?Date.parse(tank.startedAt||''):null;
  const w=[];
  if(last&&isNaN(last))last=null;
  ops.forEach(op=>{
    const d=Date.parse(op.date);if(!isNaN(d)){if(last!=null)M+=(d-last)/864e5;last=d;}
    const draw=num(op.draw)||0,fill=num(op.fill)||0,srcF=num(op.sourceOldFraction)||0,age=num(op.age)||0;
    if(op.type==='draw'||op.type==='both'||op.type==='transfer'){
      if(draw>vol+1e-9)w.push({level:'error',text:'Отбор '+fmtN(draw,1)+' л превышает объём танка '+fmtN(vol,1)+' л (операция от '+fmtD(op.date)+')'});
      vol=Math.max(0,vol-draw);
    }
    if(op.type==='fill'||op.type==='both'){
      const after=vol+fill;
      F=(F*vol+srcF*fill)/Math.max(after,1e-9);
      M=(M*vol+age*fill)/Math.max(after,1e-9);
      vol=after;
    }
    if(op.type==='both')cycles++;
  });
  const since=last?Math.max(0,(Date.now()-last)/864e5):0;
  const age=M+since;
  const stored=num(tank.currentVolume);
  if(stored!=null&&vol>0&&Math.abs(stored-vol)>Math.max(0.5,vol*0.02))
    w.push({level:'warning',text:'Указанный текущий объём ('+fmtN(stored,1)+' л) расходится с расчётом по операциям ('+fmtN(vol,1)+' л)'});
  return mkResult({value:age,unit:'дн.',confidence:'orient',range:null,
    formula:'F = Π(1−f_отбора)×(1−f_долива_старого); возраст смеси: средневзвешенный + время',
    inputs:{ops:ops.length},assumptions:[
      'Идеальное перемешивание при каждом отборе/доливе',
      'Возраст доливаемого вина берётся из поля операции (по умолчанию 0)',
      'Модель не учитывает расслоение, температурные градиенты и химические превращения'],
    warnings:w,decimals:0,
    extra:{volume:vol,oldFraction:F,newFraction:1-F,cycles,months:age/30.4,opsCount:ops.length}});
}
function calculateAging(b){
  const m=lastM(b);
  const ph=num(m&&m.ph)||num(b.juice&&b.juice.ph);
  const abv=currentABV(b);
  const ta=num(m&&m.ta);
  const rs=numberOrNull(currentSugarEstimate(b));
  const T=num(DB.settings.storageTemp)??10;
  const base={classic:[6,24],petnat:[1,6],still:[3,18],solera:[6,36]}[b.type]||[3,18];
  let lo=base[0],hi=base[1];const reasons=[];const ctrl=[];
  if(abv!=null){if(abv>=6.5){lo*=1.2;hi*=1.15;reasons.push('достаточный ABV ('+fmtN(abv,1)+'%) поддерживает стабильность — окно шире');}else if(abv<5){lo*=0.8;hi*=0.8;reasons.push('низкий ABV ('+fmtN(abv,1)+'%) — окно короче, риск биологической нестабильности');}}
  if(ph!=null){if(ph<3.2){lo*=1.1;hi*=1.15;reasons.push('низкий pH ('+fmtN(ph,2)+') — микробиальная стабильность, окно шире');}else if(ph>3.8){lo*=0.8;hi*=0.75;reasons.push('высокий pH ('+fmtN(ph,2)+') — окно короче, выше риск порчи');}}
  if(ta!=null){if(ta>=7)reasons.push('высокая кислотность ('+fmtN(ta,1)+' г/л) — свежесть сохранится дольше');else if(ta<4)reasons.push('низкая кислотность ('+fmtN(ta,1)+' г/л) — аромат быстрее теряет яркость');}
  if(rs!=null&&rs>15){lo*=0.85;reasons.push('заметный остаточный сахар ('+fmtN(rs,0)+' г/л) — контролировать реферментацию, пить раньше');}
  if(T>14){hi*=0.8;reasons.push('тёплое хранение ('+fmtN(T,0)+' °C) сокращает окно');ctrl.push('проверять каждые 2–4 недели');}
  if(b.type==='petnat')reasons.push('Pet-Nat традиционно пьют молодым');
  lo=Math.max(0.5,Math.round(lo*10)/10);hi=Math.round(hi*10)/10;
  if(!ctrl.length)ctrl.push(rs!=null&&rs>15?'проверять каждые 2–4 недели':'проверять каждые 1–2 месяца');
  return mkResult({value:lo,unit:'мес.',confidence:'orient',range:{min:lo,max:hi},decimals:1,
    formula:'экспертная модель: базовое окно по типу × поправки на pH / ABV / кислотность / сахар / температуру',
    inputs:{ph,abv,ta,rs,T,type:b.type},assumptions:['Это НЕ рекомендация-предписание, а ориентировочное окно по эвристикам'],warnings:[],
    extra:{hi,reasons,ctrl}});
}
const numberOrNull=r=>r?r.value:null;
function currentABV(b){
  const m=lastM(b);if(!m)return null;
  if(num(m.abv)!=null)return num(m.abv);
  const bx0=num(b.juice&&b.juice.brix);
  if(num(m.sg)!=null&&bx0!=null){const est=calculateResidualSugar({rb:num(m.brix),sg:num(m.sg),brixInitial:bx0});return est.extra&&est.extra.abvEst!=null?est.extra.abvEst:null;}
  return null;
}
function lastM(b){if(!b||!b.measurements||!b.measurements.length)return null;const ms=[...b.measurements].sort((a,c)=>mTS(a)-mTS(c));return ms[ms.length-1]}
function currentSugarEstimate(b){
  const m=lastM(b);if(!m)return null;
  return calculateResidualSugar({rb:num(m.brix),sg:num(m.sg),abv:num(m.abv),brixInitial:num(b.juice&&b.juice.brix),temp:num(m.temp)});
}

  '1.1':d=>{d.batches.forEach(b=>{b.type=b.type||'classic';b.photos=b.photos||[];});d.soleras=d.soleras||[];d.schemaVersion='2.0';return d;},

async function backupSnapshot(data,label){
  const name='cider_backup_'+label+'_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';
  try{
    if(ST.mode==='fs'&&ST.dirHandle){const fh=await ST.dirHandle.getFileHandle(name,{create:true});const w=await fh.createWritable();await w.write(JSON.stringify(data,null,2));await w.close();}
    else if(ST.mode==='file'&&ST.fileHandle){downloadText(name,JSON.stringify(data,null,2));}
    else{try{localStorage.setItem('cj_backup_preMig',JSON.stringify(data));}catch(e){}}
    toast('Создана резервная копия перед миграцией: '+name,'ok');
  }catch(e){toast('Не удалось создать резервную копию перед миграцией','err');}
}
async function migrateData(data){
  if(!data||typeof data!=='object'||!Array.isArray(data.batches))throw new Error('Структура файла не похожа на cider_data.json');
  let v=String(data.schemaVersion||'1.0');
  const order=['1.0','1.1','2.0','2.1','2.2','2.3'];
  if(!order.includes(v)){toast('Неизвестная версия схемы '+esc(v)+' — данные загружены без миграции','warn');normalizeDB(data);return data;}
  let steps=0;
  while(v!==SCHEMA_VERSION&&MIGRATIONS[v]&&steps<10){
    await backupSnapshot(data,v);
    data=MIGRATIONS[v](clone(data));v=data.schemaVersion;steps++;
  }
  normalizeDB(data);
  return data;
}

    r.onsuccess=()=>{idb._db=r.result;res(true)};r.onerror=()=>res(false);}catch(e){res(false)}})},
  get(store,key){return new Promise(res=>{if(!idb._db)return res(null);try{const tx=idb._db.transaction(store,'readonly').objectStore(store).get(key);tx.onsuccess=()=>res(tx.result||null);tx.onerror=()=>res(null);}catch(e){res(null)}})},

  del(store,key){return new Promise(res=>{if(!idb._db)return res(false);try{const tx=idb._db.transaction(store,'readwrite');tx.objectStore(store).delete(key);tx.oncomplete=()=>res(true);tx.onerror=()=>res(false);}catch(e){res(false)}})}

/* ---------- 7. ПРЕДУПРЕЖДЕНИЯ / ВАЛИДАЦИЯ ---------- */
function computeWarnings(b){
  const out=[];const m=lastM(b);const st=b.status;
  const active=['primary','secondary','aging','bottle_aging'].includes(st);
  if(m){
    if(num(m.temp)==null)out.push({level:'warning',code:'temp',text:'Не указана температура последнего измерения'});
    const ph=num(m.ph);
    if(ph!=null&&(ph<(b.phRange?b.phRange[0]:3.2)||ph>(b.phRange?b.phRange[1]:3.8)))
      out.push({level:'warning',code:'ph',text:'pH '+fmtN(ph,2)+' вне заданного диапазона '+fmtN(b.phRange?b.phRange[0]:3.2,2)+'–'+fmtN(b.phRange?b.phRange[1]:3.8,2)});
    if(active&&daysSince(m.date)>(DB.settings.controlDays||7))
      out.push({level:'warning',code:'stale',text:'Пропущено контрольное измерение: последнее '+fmtD(m.date)});
  }else if(active)out.push({level:'warning',code:'nomeas',text:'Нет измерений на активной стадии'});
  // Brix не меняется 72 ч
  const ms=[...b.measurements].filter(x=>num(x.brix)!=null).sort((a,c)=>mTS(a)-mTS(c));
  if(st==='primary'&&ms.length>=2){
    const a1=ms[ms.length-2],a2=ms[ms.length-1];
    if(Math.abs(num(a1.brix)-num(a2.brix))<0.1&&mTS(a2)-mTS(a1)>=72*36e5)
      out.push({level:'warning',code:'stuck',text:'Brix не изменяется 72 часа — проверьте брожение'});
  }
  // давление
  if(b.type==='petnat'&&num(b.petnat&&b.petnat.bottleLimit)!=null&&num(b.petnat&&b.petnat.targetBar)!=null){
    const lim=num(b.petnat.bottleLimit),tgt=num(b.petnat.targetBar);
    if(tgt>lim)out.push({level:'danger',code:'press',text:'ОПАСНО: целевое давление '+fmtN(tgt,1)+' bar выше предела бутылки '+fmtN(lim,1)+' bar'});
    else if(tgt>lim*0.8)out.push({level:'warning',code:'press',text:'Давление приближается к пределу бутылки ('+fmtN(tgt,1)+' из '+fmtN(lim,1)+' bar)'});
  }
  // расхождение приборов
  const mm=lastM(b);
  if(mm&&num(mm.brix)!=null&&num(mm.sg)!=null&&num(mm.abv)!=null){
    const c=compareInstruments({rb:mm.brix,sg:mm.sg,abv:mm.abv});
    if(c.value!=null&&!c.extra.agree)out.push({level:'warning',code:'div',text:'Рефрактометр и ареометр сильно расходятся ('+fmtN(c.value,0)+'%)'});
  }
  // ABV несогласованность
  if(mm&&num(mm.abv)!=null&&num(mm.brix)!=null&&num(mm.sg)!=null){
    const est=(0.004*num(mm.brix)-(num(mm.sg)-1))/0.00348;
    if(est>0&&Math.abs(est-num(mm.abv))>1.5)out.push({level:'warning',code:'abv',text:'Расчётный ABV ('+fmtN(est,1)+'%) не согласуется с введённым ('+fmtN(num(mm.abv),1)+'%)'});
  }
  // стадия дольше ожидаемого
  const sh=b.stageHistory[b.stageHistory.length-1];
  if(sh&&STAGE_DUR[b.status]&&(Date.parse(todayISO())-Date.parse(sh.date))/864e5>STAGE_DUR[b.status]*1.5&&b.status!=='done')
    out.push({level:'info',code:'stage',text:'Партия на этапе «'+STAGE_MAP[b.status]+'» дольше ожидаемого'});
  return out;
}
function validateBatch(b){
  const out=[];
  const vi=num(b.volumeInitial),vc=num(b.volumeCurrent);
  if(vi!=null&&vi<=0)out.push({level:'error',text:'Исходный объём должен быть > 0'});
  if(vc!=null&&vc<0)out.push({level:'error',text:'Отрицательный текущий объём'});
  if(vi!=null&&vc!=null&&vc>vi+0.001)out.push({level:'warning',text:'Текущий объём больше исходного — проверьте данные'});
  if(b.pressDate&&b.pressDate>todayISO())out.push({level:'warning',text:'Дата прессования в будущем'});
  b.measurements.forEach(m=>{
    if(b.pressDate&&m.date&&m.date<b.pressDate)out.push({level:'error',text:'Измерение '+fmtD(m.date)+' раньше даты прессования'});
    const bx=num(m.brix);if(bx!=null&&(bx<0||bx>40))out.push({level:'error',text:'Brix '+fmtN(bx,1)+' вне диапазона 0–40 ('+fmtD(m.date)+')'});
    const sg=num(m.sg);if(sg!=null&&(sg<0.95||sg>1.15))out.push({level:'error',text:'SG '+fmtN(sg,3)+' вне разумного диапазона 0.95–1.15 ('+fmtD(m.date)+')'});
    const ph=num(m.ph);if(ph!=null&&(ph<0||ph>14))out.push({level:'error',text:'pH вне 0–14 ('+fmtD(m.date)+')'});
    const av=num(m.abv);if(av!=null&&av<0)out.push({level:'error',text:'Отрицательный ABV ('+fmtD(m.date)+')'});
    const pr=num(m.pressure);if(pr!=null&&pr<0)out.push({level:'error',text:'Отрицательное давление ('+fmtD(m.date)+')'});
  });
  const rosev=b.operations.filter(o=>o.type==='розлив');
  const firstFerm=b.measurements.filter(m=>m.stage==='primary').sort((a,c)=>mTS(a)-mTS(c))[0];
  rosev.forEach(o=>{if(firstFerm&&o.date&&o.date<mTS(firstFerm)&&false){}});
  rosev.forEach(o=>{if(firstFerm&&mTS({date:o.date,time:'12:00'})<mTS(firstFerm))out.push({level:'warning',text:'Розлив ('+fmtD(o.date)+') раньше начала ферментации — проверьте даты'})});
  const dis=b.operations.filter(o=>o.type==='дегоржаж');
  dis.forEach(dg=>{rosev.forEach(rz=>{if(dg.date&&rz.date&&dg.date<rz.date)out.push({level:'error',text:'Дегоржаж ('+fmtD(dg.date)+') раньше розлива ('+fmtD(rz.date)+')'})})});
  return out;
}
function validateMeasurement(m){
  const out=[];
  if(!m.date)out.push({level:'error',text:'Дата обязательна'});
  const sg=num(m.sg);if(sg!=null&&(sg<0.95||sg>1.15))out.push({level:'error',text:'SG вне 0.95–1.15'});
  const bx=num(m.brix);if(bx!=null&&(bx<0||bx>40))out.push({level:'error',text:'Brix вне 0–40'});
  const ph=num(m.ph);if(ph!=null&&(ph<0||ph>14))out.push({level:'error',text:'pH вне 0–14'});
  const pr=num(m.pressure);if(pr!=null&&pr<0)out.push({level:'error',text:'Давление не может быть отрицательным'});
  const av=num(m.abv);if(av!=null&&av<0)out.push({level:'error',text:'ABV не может быть отрицательным'});
  if(num(m.brix)!=null&&sg!=null&&sg>1.0){
    const exp=brixToSG(bx);
    if(sg-exp>0.005)out.push({level:'warning',text:'SG выше, чем ожидается из Brix — проверьте приборы (для бродящего сусла SG обычно ниже)'});
  }
  if(num(m.temp)==null)out.push({level:'info',text:'Добавьте температуру — она нужна для коррекций и расчёта давления'});
  return out;
}

function fermChartSVG(){
  const b=cur();if(!b)return '';
  const ms=[...b.measurements].sort((a,c)=>mTS(a)-mTS(c));
  const mk=(key,corr)=>ms.filter(m=>num(m.brix)!=null).map(m=>{
    let y=num(m.brix);
    if(corr){const r=calculateResidualSugar({rb:m.brix,sg:m.sg,abv:m.abv,brixInitial:b.juice?b.juice.brix:null});
      if(r.extra&&r.extra.trueBrix!=null)y=r.extra.trueBrix;else if(corr)return null;}
    return {x:mTS(m),y,extra:m};
  }).filter(Boolean);
  const series=[];
  if(VS.chart.raw)series.push({name:'Brix сырой',color:'#a2836e',axis:'L',unit:'°Bx',points:mk('brix',false)});
  if(VS.chart.corr)series.push({name:'Brix скорр.',color:'#3f6f5e',axis:'L',unit:'°Bx',points:mk('brix',true)});
  if(VS.chart.sg)series.push({name:'SG',color:'#5b7a9d',axis:'R',unit:'SG',points:ms.filter(m=>num(m.sg)!=null).map(m=>({x:mTS(m),y:num(m.sg),extra:m}))});
  return chartSVG(series);
}
function miniCharts(b){
  const defs=[['pH','ph','#8b7bb8',2],['Температура, °C','temp','#c17f59',1],['ABV, %','abv','#4a7c59',1],['Давление, bar','pressure','#b0413e',1]];
  const ms=[...b.measurements].sort((a,c)=>mTS(a)-mTS(c));
  return defs.map(d=>{
    const pts=ms.filter(m=>num(m[d[1]])!=null).map(m=>({x:mTS(m),y:num(m[d[1]])}));
    const last=pts.length?pts[pts.length-1].y:null;
    return '<div class="mini"><div class="mt"><span>'+d[0]+'</span><span class="mv">'+fmtN(last,d[3])+'</span></div>'+
      '<div class="chartbox">'+sparkSVG(pts,d[2])+'</div></div>';
  }).join('');
}
function sparkSVG(pts,color){
  const W=220,H=60;if(pts.length<2)return '<svg viewBox="0 0 '+W+' '+H+'"><text x="110" y="34" text-anchor="middle" font-size="10" fill="var(--ink3)">нужно ≥2 точки</text></svg>';
  const t0=pts[0].x,t1=pts[pts.length-1].x,span=Math.max(t1-t0,1);
  const ys=pts.map(p=>p.y);let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1;}
  const X=x=>4+(x-t0)/span*(W-8),Y=y=>4+(1-(y-mn)/(mx-mn))*(H-8);
  return '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><path d="'+pts.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ')+'" fill="none" stroke="'+color+'" stroke-width="2"/>'+
  pts.map(p=>'<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y).toFixed(1)+'" r="2.5" fill="'+color+'"><title>'+fmtD(p.x)+' — '+fmtN(p.y,2)+'</title></circle>').join('')+'</svg>';
}
function chartSVG(series){
  const W=780,H=300,pl=56,pr=56,pt=14,pb=28;
  const all=series.flatMap(s=>s.points);
  if(!all.length)return '<div class="empty">Нет данных для графика</div>';
  const t0=Math.min(...all.map(p=>p.x)),t1=Math.max(...all.map(p=>p.x));
  const span=Math.max(t1-t0,36e5);
  const X=x=>pl+(x-t0)/span*(W-pl-pr);
  const sc=ax=>{const ys=series.filter(s=>(s.axis||'L')===ax).flatMap(s=>s.points.map(p=>p.y));if(!ys.length)return null;let mn=Math.min(...ys),mx=Math.max(...ys);if(mn===mx){mn-=1;mx+=1;}const pad=(mx-mn)*0.12;return{mn:mn-pad,mx:mx+pad}};
  const sL=sc('L'),sR=sc('R');
  const Y=(v,ax)=>{const s=ax==='R'?sR:sL;if(!s)return H/2;return pt+(1-(v-s.mn)/(s.mx-s.mn))*(H-pt-pb)};
  let g='';
  for(let i=0;i<=4;i++){const y=pt+i*(H-pt-pb)/4;
    g+='<line x1="'+pl+'" y1="'+y+'" x2="'+(W-pr)+'" y2="'+y+'" stroke="var(--bord)" stroke-width="1"/>';
    if(sL)g+='<text x="'+(pl-6)+'" y="'+(y+4)+'" text-anchor="end" font-size="10" fill="var(--ink3)" font-family="var(--f-mono)">'+fmtN(sL.mx-(sL.mx-sL.mn)*i/4,2)+'</text>';
    if(sR)g+='<text x="'+(W-pr+6)+'" y="'+(y+4)+'" font-size="10" fill="var(--ink3)" font-family="var(--f-mono)">'+fmtN(sR.mx-(sR.mx-sR.mn)*i/4,3)+'</text>';}
  for(let i=0;i<=4;i++){const x=pl+i*(W-pl-pr)/4;
    g+='<text x="'+x+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--ink3)">'+fmtD(t0+span*i/4)+'</text>';}
  series.forEach(s=>{if(!s.points.length)return;
    const d=s.points.map((p,i)=>(i?'L':'M')+X(p.x).toFixed(1)+' '+Y(p.y,s.axis).toFixed(1)).join(' ');
    g+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2.2" stroke-dasharray="'+(s.dash||'')+'"/>'+
    s.points.map(p=>'<circle cx="'+X(p.x).toFixed(1)+'" cy="'+Y(p.y,s.axis).toFixed(1)+'" r="3.4" fill="'+s.color+'"><title>'+fmtD(p.x)+' — '+fmtN(p.y,s.unit==='SG'?3:2)+' '+s.unit+(p.extra&&p.extra.method?' ('+esc(p.extra.method)+')':'')+'</title></circle>').join('');});
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="График брожения">'+g+'</svg>';
}

function measTableHTML(b){
  let list=[...b.measurements];
  const f=VS.mt;const q=f.q.toLowerCase();
  if(q)list=list.filter(m=>(m.comment||'').toLowerCase().includes(q)||(m.device||'').toLowerCase().includes(q));
  if(f.method)list=list.filter(m=>m.method===f.method);
  if(f.stage)list=list.filter(m=>m.stage===f.stage);
  const dir=f.dir;
  list.sort((a,c)=>{const k=f.sort;let va,vc;
    if(k==='date'){va=mTS(a);vc=mTS(c);}else{va=num(a[k]);vc=num(c[k]);if(va==null)return 1;if(vc==null)return -1;}
    return (va-vc)*dir;});
  if(!list.length)return '<div class="empty">Измерений нет. Добавьте первое.</div>';
  const arrow=k=>VS.mt.sort===k?(dir<0?' ↓':' ↑'):'';
  return '<div class="tblwrap"><table class="tbl"><thead><tr>'+
  [['date','Дата'],['stage','Этап'],['brix','Brix'],['sg','SG'],['oe','°Oe'],['ph','pH'],['temp','Temp'],['abv','ABV'],['pressure','bar'],['method','Метод'],['','']].map(h=>
    '<th '+(h[0]?'data-sort="'+h[0]+'"':'class="nos"')+'>'+h[1]+arrow(h[0])+'</th>').join('')+'</tr></thead><tbody>'+
  list.map(m=>{
    const sg=num(m.sg),oe=sg!=null?sgToOe(sg):num(m.oe);
    return '<tr><td>'+fmtD(m.date)+(m.time?' '+esc(m.time):'')+'</td><td class="txt">'+esc(STAGE_MAP[m.stage]||m.stage||'')+'</td>'+
    '<td>'+fmtN(num(m.brix),1)+'</td><td>'+fmtN(sg,3)+'</td><td>'+fmtN(oe,0)+'</td><td>'+fmtN(num(m.ph),2)+'</td><td>'+fmtN(num(m.temp),1)+'</td>'+
    '<td>'+fmtN(num(m.abv),1)+'</td><td>'+fmtN(num(m.pressure),1)+'</td><td class="txt">'+esc(m.method||'')+'</td>'+
    '<td><div class="rowbtns"><button class="ibtn" data-action="edit-measurement" data-id="'+m.id+'" aria-label="Редактировать">'+icon('edit')+'</button>'+
    '<button class="ibtn del" data-action="del-measurement" data-id="'+m.id+'" aria-label="Удалить">'+icon('trash')+'</button></div></td></tr>';
  }).join('')+'</tbody></table></div><p class="small muted" style="margin-top:8px">Всего: '+list.length+' из '+b.measurements.length+'. Клик по заголовку — сортировка.</p>';
}
/* --- Расчёты --- */
function tabCalcs(b){
  const m=lastM(b);
  let cards='';
  const jx=num(b.juice&&b.juice.brix);
  cards+=calcCard(jx!=null?calculatePotentialABV({brix:b.juice.brix,sg:b.juice.sg}):null,'Ориентировочный потенциальный ABV (Stage 1)');
  cards+=calcCard(m?currentSugarEstimate(b):null,'Коррекция рефрактометра и остаточный сахар (последнее измерение)');
  const cmp=m&&num(m.brix)!=null&&num(m.sg)!=null&&num(m.abv)!=null?compareInstruments({rb:m.brix,sg:m.sg,abv:m.abv}):null;
  if(cmp)cards+=calcCard(cmp,'Сравнение приборов: рефрактометр vs ареометр');
  if(b.type==='petnat')cards+='<div class="panel glass"><h3>Pet-Nat</h3><p class="hint">Полный калькулятор — на вкладке «Розлив». Ключевой вывод живёт там же.</p></div>';
  if(b.type==='classic')cards+='<div class="panel glass"><h3>Ликёр (Classic)</h3><p class="hint">Полный калькулятор — на вкладке «Розлив».</p></div>';
  if(b.type==='solera'&&b.soleraId){const t=getTank(b.soleraId);if(t)cards+=calcCard(calculateSolera(t),'Solera: '+esc(t.name));}
  cards+=calcCard(calculateAging(b),'Ориентировочное окно выдержки');
  return '<div class="grid2">'+cards+'</div>';
}

const LIVE={};
function updateLive(){$$('[data-live]').forEach(el=>{const fn=LIVE[el.dataset.live];if(fn){try{el.innerHTML=fn();}catch(e){el.innerHTML='<div class="hint">Ошибка отображения расчёта</div>';}}});}
LIVE.ovstate=()=>{
  const b=cur();if(!b)return '';
  const est=currentSugarEstimate(b);const abv=currentABV(b);const m=lastM(b);
  const cell=(l,v)=>'<div class="stat"><div class="lbl">'+l+'</div><div class="val">'+v+'</div></div>';
  let h='';
  h+=cell('Скорректир. Brix',est&&est.extra.trueBrix!=null?'≈ '+fmtN(est.extra.trueBrix,1):'—');
  h+=cell('Остат. сахар',est&&est.value!=null?'≈ '+fmtN(est.value,0)+' <small>г/л</small>':'—');
  h+=cell('ABV оценка',abv!=null?'≈ '+fmtN(abv,1)+' <small>%</small>':'—');
  h+=cell('SG (посл.)',m?fmtN(num(m.sg),3):'—');
  h+=cell('°Oe (посл.)',m&&num(m.sg)!=null?fmtN(sgToOe(num(m.sg)),0):'—');
  h+=cell('pH (посл.)',m?fmtN(num(m.ph),2):'—');
  if(b.type==='petnat')h+=cell('Целевое давление',b.petnat.targetBar?'≈ '+fmtN(num(b.petnat.targetBar),1)+' <small>bar</small>':'—');
  return h;
};
LIVE.ovwarn=()=>{
  const b=cur();if(!b)return '';

  const row=w=>'<div class="wi"><span style="color:var(--'+(w.level==='danger'?'danger':w.level==='warning'?'warn':w.level==='error'?'danger':'info')+')">'+icon(w.level==='info'?'info':'warn')+'</span><span>'+esc(w.text)+'</span></div>';
  let h='';
  if(warns.length)h+='<h3 class="small muted" style="margin-bottom:6px">АВТОМАТИЧЕСКИЕ ПРЕДУПРЕЖДЕНИЯ</h3><div class="warnlist">'+warns.map(row).join('')+'</div>';
  if(val.length)h+='<h3 class="small muted" style="margin:14px 0 6px">ВАЛИДАЦИЯ</h3><div class="warnlist">'+val.map(row).join('')+'</div>';
  if(!warns.length&&!val.length)h='<div class="hint">Проблем не обнаружено.</div>';

LIVE.juicecalcs=()=>{
  const b=cur();if(!b)return '';
  const bx=num(b.juice.brix),sg=num(b.juice.sg),mass=num(b.apples.mass),vol=num(b.juice.volumeL);
  let h='';
  const oe=sg!=null?sgToOe(sg):(bx!=null?sgToOe(brixToSG(bx)):null);
  h+='<div class="statgrid">'+
  '<div class="stat"><div class="lbl">Расчётный SG</div><div class="val">'+(bx!=null?fmtN(brixToSG(bx),4):(sg!=null?fmtN(sg,4):'—'))+'</div></div>'+
  '<div class="stat"><div class="lbl">Расчётный °Oe</div><div class="val">'+(oe!=null?fmtN(oe,0):'—')+'</div></div>'+
  '<div class="stat"><div class="lbl">Выход сока</div><div class="val">'+(mass&&vol?fmtN(vol/mass*100,0)+' <small>%</small>':'—')+'</div></div>'+
  '<div class="stat"><div class="lbl">Сахар ≈</div><div class="val">'+(bx!=null?fmtN(sugarFromBrix(bx,sg||1),0)+' <small>г/л</small>':'—')+'</div></div></div>';
  const pot=bx!=null?calcCard(calculatePotentialABV({brix:b.juice.brix,sg:b.juice.sg}),'Ориентировочный потенциальный ABV'):'<p class="hint">Введите Brix или SG для расчётов.</p>';
  h+=pot;
  if(bx!=null&&sg!=null&&Math.abs(brixToSG(bx)-sg)>0.006)h+='<div class="warnlist"><div class="wi">'+icon('warn')+'<span>Brix и SG не согласуются: из Brix '+fmtN(bx,1)+' ожидается SG ≈ '+fmtN(brixToSG(bx),4)+', введён '+fmtN(sg,4)+'.</span></div></div>';
  return h;
};
function confChip(c){return '<span class="chip conf conf-'+c+'">Уверенность: '+CONF_LABEL[c]+'</span>';}
function warnListHTML(w){if(!w||!w.length)return '';return '<div class="warnlist">'+w.map(x=>'<div class="wi"><span style="color:var(--'+(x.level==='error'||x.level==='danger'?'danger':x.level==='warning'?'warn':'info')+')">'+icon(x.level==='info'?'info':'warn')+'</span><span>'+esc(x.text)+'</span></div>').join('')+'</div>';}
function calcCard(res,title){
  if(!res)return '';
  if(res.value==null){
    return '<div class="panel glass" style="margin-bottom:0"><div class="calc-head"><span>'+esc(title)+'</span>'+(res.confidence?confChip(res.confidence):'')+'</div>'+
    '<p class="hint" style="margin-top:10px">'+esc(res.hint||'Недостаточно данных для расчёта.')+'</p>'+warnListHTML(res.warnings)+'</div>';
  }
  const d=res.decimals!=null?res.decimals:1;
  const range=res.range?'<div class="rng">Оценочный диапазон: '+fmtN(res.range.min,d)+' – '+fmtN(res.range.max,d)+' '+esc(res.unit)+'</div>':'';
  return '<div class="panel glass '+(res.danger?'dangerbox':'')+'" style="margin-bottom:0'+(res.danger?';padding:14px':'')+'">'+
  '<div class="calc-head"><span>'+esc(title)+'</span>'+confChip(res.confidence)+'</div>'+
  (res.danger?'':'<div class="calc-value">'+(res.approx?'≈ ':'')+fmtN(res.value,d)+' <span class="unit">'+esc(res.unit)+'</span></div>'+range)+
  (res.formula?'<div class="formula">Формула: '+esc(res.formula)+'</div>':'')+
  (res.assumptions&&res.assumptions.length?'<ul class="assump">'+res.assumptions.map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul>':'')+
  warnListHTML(res.warnings)+
  (res.extra&&res.extra.reasons?'<div class="calc-note"><b>Причины:</b><ul class="assump">'+res.extra.reasons.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul><b>Контроль:</b> '+esc(res.extra.ctrl.join('; '))+'</div>':'')+
  '<div class="calc-note small">⚠ Все расчёты — технологические оценки, а не лабораторные измерения. Для точного определения остаточного сахара рекомендуется лабораторный анализ.</div></div>';
}
LIVE.refcorr=()=>{
  const b=cur();if(!b)return '';
  const m=lastM(b);
  if(!m)return '<h3>Коррекция рефрактометра</h3><p class="hint">Добавьте измерение, чтобы получить скорректированный Brix и оценку остаточного сахара.</p>';
  const r=calculateRefractometerCorrection({rb:m.brix,sg:m.sg,abv:m.abv,brixInitial:b.juice?b.juice.brix:null,temp:m.temp});
  const res=r.result;
  let h='<h3>Refractometer Correction Engine</h3>';
  h+='<div class="statgrid" style="margin:10px 0">'+
  '<div class="stat"><div class="lbl">Рефрактометр (сырой)</div><div class="val">'+fmtN(r.raw,1)+' <small>°Bx</small></div></div>'+
  (r.sg!=null?'<div class="stat"><div class="lbl">Ареометр</div><div class="val">'+fmtN(r.sg,3)+' <small>SG</small></div></div>':'')+
  (r.abv!=null?'<div class="stat"><div class="lbl">ABV</div><div class="val">'+fmtN(r.abv,1)+' <small>%</small></div></div>':'')+
  '<div class="stat"><div class="lbl">Скорректир. Brix</div><div class="val">'+(res.extra&&res.extra.trueBrix!=null?'≈ '+fmtN(res.extra.trueBrix,1):'—')+'</div></div>'+
  '<div class="stat"><div class="lbl">Остаточн. сахар</div><div class="val">'+(res.value!=null?'≈ '+fmtN(res.value,0)+' <small>г/л</small>':'—')+'</div></div></div>';
  h+=confChip(res.confidence)+' <span class="chip">Путь: '+esc(res.extra.path||'')+'</span>';
  if(r.reason)h+='<div class="calc-note"><b>Причина:</b> '+esc(r.reason)+'</div>';
  if(r.needs.length)h+='<div class="warnlist"><div class="wi">'+icon('info')+'<span>Для повышения точности добавьте: '+esc(r.needs.join(', '))+'</span></div></div>';
  h+='<div class="formula">'+esc(res.formula)+'</div>';
  h+='<ul class="assump">'+(res.assumptions||[]).map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul>';
  h+=warnListHTML(res.warnings);
  h+='<div class="calc-note">⚠ Результат зависит от: точности ABV, температуры, типа рефрактометра, состава напитка, остаточных растворённых веществ. Показание рефрактометра после начала ферментации ≠ фактический Brix.</div>';
  return h;
};
LIVE.petnat=()=>{
  const b=cur();if(!b)return '';
  const pn=b.petnat;
  const target=num(pn.targetBar);
  if(target==null)return '<h3>Расчёт</h3><p class="hint">Укажите целевое давление — приложение рассчитает, сколько сахара должно дображивать, и что вы должны увидеть на приборах.</p>';
  const lim=num(pn.bottleLimit);
  const r=calculatePetNat({targetBar:target,temp:pn.temp,residualCO2:pn.residCO2,fermentFrac:pn.fermFrac,
    rb:pn.rb,sg:pn.sg,abv:pn.abv,brixInitial:b.juice?b.juice.brix:null,bottleLimit:lim});
  const sec=t=>'<h3 class="small muted" style="margin:16px 0 8px;letter-spacing:.06em">'+t+'</h3>';
  let h='';
  h+='<div class="calc-head"><span style="font-weight:800">Целевое давление</span>'+(r.extra.atm!=null?'<span class="chip">'+fmtN(r.extra.atm,2)+' atm</span>':'')+'</div>';
  h+='<div class="calc-value">'+fmtN(target,1)+' <span class="unit">bar</span></div>';
  if(lim!=null&&target>lim)h+='<div class="dangerbox">'+icon('warn')+'<div>ОПАСНО: расчётное давление превышает заданный предел бутылки ('+fmtN(lim,1)+' bar).</div></div>';
  else if(lim!=null&&target>lim*0.8)h+='<div class="warnlist"><div class="wi">'+icon('warn')+'<span>Целевое давление приближается к пределу бутылки.</span></div></div>';
  h+=sec('ТЕКУЩЕЕ СОСТОЯНИЕ');
  const corr=r.extra.corr;
  if(corr.value==null)h+='<p class="hint">Нет данных измерений: введите RB и/или SG (+ABV) слева.</p>'+warnListHTML(corr.warnings);
  else{
    h+='<div class="statgrid">'+
    '<div class="stat"><div class="lbl">Оценочн. реальный Brix</div><div class="val">'+(corr.extra.trueBrix!=null?'≈ '+fmtN(corr.extra.trueBrix,1):'—')+'</div></div>'+
    '<div class="stat"><div class="lbl">Остаточн. сахар</div><div class="val">≈ '+fmtN(corr.value,0)+' <small>г/л</small></div></div>'+
    '<div class="stat"><div class="lbl">Сбраживаемый сахар</div><div class="val">≈ '+fmtN(r.extra.snow,0)+' <small>г/л</small></div></div></div>';
    h+='<div style="margin-top:8px">'+confChip(corr.confidence)+' <span class="chip">Путь: '+esc(corr.extra.path)+'</span></div>';
  }
  h+=sec('ЦЕЛЬ ПО САХАРУ');
  const tgt=r.extra.tgt;
  h+='<div class="calc-value">≈ '+fmtN(tgt.value,1)+' <span class="unit">г/л сбраживаемого сахара</span></div>';
  if(tgt.range)h+='<div class="rng">'+fmtN(tgt.range.min,1)+' – '+fmtN(tgt.range.max,1)+' г/л</div>';
  if(r.extra.deltaTxt)h+='<div class="formula">'+esc(r.extra.deltaTxt)+'</div>';
  h+='<ul class="assump">'+(tgt.assumptions||[]).map(a=>'<li>'+esc(a)+'</li>').join('')+'</ul>';
  h+=sec('ЧТО ПОКАЖЕТ ПРИБОР');
  const trb=r.extra.tgtRB,tsg=r.extra.tgtSG;
  h+='<div class="statgrid">'+
  '<div class="stat"><div class="lbl">Рефрактометр (ожидаемо)</div><div class="val">'+(trb.value!=null?'≈ '+fmtN(trb.value,1)+' <small>°Bx</small>':'—')+'</div></div>'+
  '<div class="stat"><div class="lbl">Ареометр (ожидаемо)</div><div class="val">'+(tsg.value!=null?'≈ '+fmtN(tsg.value,3):'—')+'</div></div>'+
  '<div class="stat"><div class="lbl">°Oe (ожидаемо)</div><div class="val">'+(tsg.extra&&tsg.extra.oe!=null?'≈ '+fmtN(tsg.extra.oe,0):'—')+'</div></div>'+
  '<div class="stat"><div class="lbl">Реальный сахар (цель)</div><div class="val">≈ '+fmtN(tgt.value,1)+' <small>г/л</small></div></div></div>';
  h+=warnListHTML([].concat(trb.warnings||[],tsg.warnings||[]));
  if(r.extra.cmp&&r.extra.cmp.value!=null){
    h+=sec('СРАВНЕНИЕ ПРИБОРОВ');
    const c=r.extra.cmp;
    h+='<div class="formula">Рефрактометр → сахар: ≈'+fmtN(c.extra.sRB,0)+' г/л\nАреометр → сахар: ≈'+fmtN(c.extra.sSG,0)+' г/л\nРасхождение: '+fmtN(c.value,1)+'%</div>';
    h+=warnListHTML(c.warnings);
    h+='<span class="chip '+(c.extra.agree?'sev-ok':'sev-warning')+'">'+(c.extra.agree?'Данные согласованы':'Данные расходятся — проверьте условия')+'</span>';
  }
  h+=sec('ОЖИДАЕМОЕ ДАВЛЕНИЕ ПРИ РОЗЛИВЕ СЕЙЧАС');
  const pw=r.extra.pnow;
  if(pw&&pw.value!=null){
    h+='<div class="calc-value">'+(pw.danger?'':'≈ ')+fmtN(pw.value,1)+' <span class="unit">bar</span></div>';
    if(pw.range)h+='<div class="rng">'+fmtN(pw.range.min,1)+' – '+fmtN(pw.range.max,1)+' bar</div>';
    h+=confChip(pw.confidence);
    if(pw.danger)h+='<div class="dangerbox">'+icon('warn')+'<div>ОПАСНО: расчётное давление превышает заданный предел бутылки ('+fmtN(num(pn.bottleLimit),1)+' bar).</div></div>';
    h+=warnListHTML(pw.warnings);
  } else h+='<p class="hint">Введите текущие показания приборов для оценки давления.</p>';
  h+='<div class="calc-note">⚠ Показания приборов после начала ферментации не равны непосредственно остаточному сахару. Расчёт — ориентировочная технологическая оценка: фактическое давление зависит от температуры, сахара, полноты ферментации, дрожжей, скорости ферментации, герметичности и времени. Не используйте расчёт как гарантию безопасности.</div>';
  return h;
};
LIVE.liqueur=()=>{
  const b=cur();if(!b)return '';
  const lq=b.liqueur;
  const conc=num(lq.concGL);
  let hint='';
  if(conc==null){
    hint='<div class="warnlist"><div class="wi">'+icon('info')+'<span>Подсказка по концентрации (проверяйте сами!): сироп 1:1 ≈ 500 г/л; насыщенный сироп ≈ 900 г/л; ли Unterschied ликёр на вине — считайте по вашему рецепту.</span></div></div>';
  }
  const r=calculateLiqueur({volumeL:b.volumeCurrent,targetRS:lq.targetRS,currentRS:lq.currentRS,concGL:lq.concGL,givenVolML:lq.givenVolML,bottles:lq.bottles});
  let h='<h3>Расчёт ликёра</h3>';
  if(r.value==null){h+='<p class="hint">'+esc(r.hint||'Заполните поля слева.')+'</p>'+hint+warnListHTML(r.warnings);}
  else{
    h+='<div class="statgrid">'+
    '<div class="stat"><div class="lbl">Потребность в сахаре</div><div class="val">'+fmtN(r.extra.need,0)+' <small>г</small></div></div>'+
    '<div class="stat"><div class="lbl">Общий объём ликёра</div><div class="val">'+fmtN(r.value*1000,0)+' <small>мл</small></div></div>'+
    '<div class="stat"><div class="lbl">На бутылку</div><div class="val">'+(r.extra.perBtl!=null?fmtN(r.extra.perBtl,1)+' <small>мл</small>':'—')+'</div></div></div>';
    if(r.extra.actual!=null){
      h+='<div class="formula">Внесено ликёра '+fmtN(num(lq.givenVolML),0)+' мл × '+fmtN(conc,0)+' г/л = '+fmtN(r.extra.actual,0)+' г сахара\nИтоговый сахар в партии ≈ '+fmtN(r.extra.achieved,1)+' г/л</div>';
    }
    h+='<div class="formula">120 г / 500 г⁄л = 0.24 л → 240 мл</div>'.replace('120 г','(пример)').replace(/500 г\/л/g,'500 г/л');
    h+='<div style="margin-top:8px">'+confChip(r.confidence)+'</div>';
    h+=warnListHTML(r.warnings);
  }
  const bv=num(lq.bottleVol),vc=num(b.volumeCurrent);
  if(bv&&vc)h+='<div class="calc-note">Бутылок 0% объёма: '+Math.floor(vc/bv)+' шт (при '+fmtN(bv,2)+' л) — расчёт по текущему объёму '+fmtN(vc,1)+' л</div>'.replace('0% объёма','тиража');
  h+=hint;
  return h;
};

function calHTML(){
  const y=VS.cal.getFullYear(),mo=VS.cal.getMonth();
  const first=new Date(y,mo,1);const start=(first.getDay()+6)%7;
  const dim=new Date(y,mo+1,0).getDate();
  const evs=collectEvents(y,mo);
  let cells='';
  ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(d=>cells+='<div class="calwd">'+d+'</div>');
  for(let i=0;i<start;i++)cells+='<div class="calday out"></div>';
  const todayStr=todayISO();
  for(let d=1;d<=dim;d++){
    const ds=new Date(Date.UTC(y,mo,d)).toISOString().slice(0,10);
    const list=evs.filter(e=>e.date===ds);
    cells+='<div class="calday'+(ds===todayStr?' today':'')+'"><div class="dnum">'+d+'</div>'+
    list.slice(0,3).map(e=>'<button class="ev '+e.kind+'" data-action="open-batch" data-bid="'+e.bid+'" title="'+esc(e.label)+'">'+esc(e.label)+'</button>').join('')+
    (list.length>3?'<div class="small muted">+'+(list.length-3)+'</div>':'')+'</div>';
  }
  return '<div class="panel glass"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px"><h3 style="margin:0">'+first.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})+'</h3></div><div class="calgrid">'+cells+'</div></div>';
}
function collectEvents(y,mo){
  const out=[];const pre=new Date(Date.UTC(y,mo,1)),post=new Date(Date.UTC(y,mo+1,1));
  DB.batches.filter(b=>!b.archived).forEach(b=>{
    b.measurements.forEach(m=>{const d=m.date;if(!d)return;const t=new Date(d+'T00:00:00Z');if(t>=pre&&t<post)out.push({date:d,bid:b.id,kind:'meas',label:'изм. '+(b.name||b.code)});});
    b.operations.forEach(o=>{if(!o.date)return;const t=new Date(o.date+'T00:00:00Z');if(t>=pre&&t<post)out.push({date:o.date,bid:b.id,kind:'op',label:(o.done?'✓ ':'')+o.type});});
    b.stageHistory.forEach(s=>{if(!s.date)return;const t=new Date(s.date+'T00:00:00Z');if(t>=pre&&t<post)out.push({date:s.date,bid:b.id,kind:'stage',label:'→ '+STAGE_MAP[s.stage]});});
  });
  return out.sort((a,c)=>a.date.localeCompare(c.date));
}
function buildStageSegments(b){
  const sh=[...(b.stageHistory||[])].sort((a,c)=>String(a.date).localeCompare(String(c.date)));
  if(!sh.length)return [];
  const segs=[];const now=Date.now();
  for(let i=0;i<sh.length;i++){
    const start=Date.parse(sh[i].date+'T00:00:00');
    const end=(i<sh.length-1)?Date.parse(sh[i+1].date+'T00:00:00'):null;
    const exp=(STAGE_DUR[sh[i].stage]||14)*864e5;
    const open=end==null&&b.status!=='done';
    const effEnd=end!=null?end:(b.status==='done'?start+864e5:now);
    if(effEnd<=start)continue;
    segs.push({stage:sh[i].stage,name:STAGE_MAP[sh[i].stage]||sh[i].stage,start,end:effEnd,open,expEnd:start+exp,overdue:open&&now>start+exp});
  }
  return segs;
}
function drawGlobalTimeline(){
  const wrap=$('#tl-wrap');if(!wrap)return;
  const batches=DB.batches.filter(b=>!b.archived);
  const rows=batches.map(b=>({b,segs:buildStageSegments(b)})).filter(r=>r.segs.length);
  if(!rows.length){wrap.innerHTML='<div class="empty">Нет данных для timeline</div>';return;}
  const W=1000,lbl=170,pad=16;
  let t0=Infinity,t1=-Infinity;
  rows.forEach(r=>r.segs.forEach(s=>{t0=Math.min(t0,s.start);t1=Math.max(t1,s.end);}));
  const now=Date.now();t1=Math.max(t1,now);t0=Math.min(t0,now-30*864e5);
  const span=Math.max(t1-t0,1);
  const X=t=>lbl+(t-t0)/span*(W-lbl-pad);
  const rowH=40,headH=26,H=headH+rows.length*rowH+10;
  let g='';
  // ось времени: месяцы
  const d0=new Date(t0);d0.setDate(1);d0.setMonth(d0.getMonth());
  let mm=new Date(d0);
  while(mm.getTime()<=t1){
    const x=X(mm.getTime());
    if(x>lbl){g+='<line x1="'+x+'" y1="'+headH+'" x2="'+x+'" y2="'+(H-8)+'" stroke="var(--bord)"/><text x="'+(x+4)+'" y="16" font-size="10" fill="var(--ink3)">'+mm.toLocaleDateString('ru-RU',{month:'short',year:'2-digit'})+'</text>';}
    mm=new Date(mm.getFullYear(),mm.getMonth()+1,1);
  }
  // today
  const xt=X(now);
  g+='<line x1="'+xt+'" y1="'+headH+'" x2="'+xt+'" y2="'+(H-8)+'" stroke="var(--danger)" stroke-width="1.6" stroke-dasharray="4 3"/><text x="'+(xt+4)+'" y="'+(headH+10)+'" font-size="10" fill="var(--danger)">сегодня</text>';
  rows.forEach((r,i)=>{
    const y=headH+8+i*rowH;
    g+='<text x="6" y="'+(y+17)+'" font-size="12" font-weight="700" fill="var(--ink)">'+esc((r.b.name||r.b.code).slice(0,22))+'</text>';
    r.segs.forEach(s=>{
      const x1=X(s.start),x2=X(s.end),w=Math.max(x2-x1,3);
      const col=STAGE_COLOR[s.stage]||'#888';
      g+='<rect x="'+x1+'" y="'+(y+4)+'" width="'+w+'" height="22" rx="7" fill="'+col+'" opacity="'+(s.open?0.92:0.75)+'" style="cursor:pointer" data-action="open-batch" data-bid="'+r.b.id+'"><title>'+esc(r.b.name+' · '+s.name+' · '+fmtD(s.start)+' — '+fmtD(s.end)+(s.overdue?' · дольше ожидаемого':''))+'</title></rect>';
      if(w>64)g+='<text x="'+(x1+7)+'" y="'+(y+19)+'" font-size="10" fill="#fff" style="pointer-events:none">'+esc(s.name.slice(0,Math.floor(w/7)))+'</text>';
      if(s.overdue){g+='<rect x="'+x1+'" y="'+(y+4)+'" width="'+w+'" height="22" rx="7" fill="none" stroke="var(--warn)" stroke-width="1.6" stroke-dasharray="3 3" pointer-events="none"/>';}
    });
  });
  wrap.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="Timeline партий">'+g+'</svg>';
  const lg=$('#tl-legend');
  if(lg)lg.innerHTML=STAGES.filter(s=>['primary','secondary','aging','bottle_aging','done'].includes(s.id)).map(s=>'<span><i style="background:'+STAGE_COLOR[s.id]+'"></i>'+s.name+'</span>').join('')+'<span><i style="border:1.5px dashed var(--warn);background:none"></i>дольше ожидаемого</span>';
}
function drawBatchTimeline(){
  const b=cur();const wrap=$('#btl-wrap');if(!wrap||!b)return;
  const segs=buildStageSegments(b);
  if(!segs.length){wrap.innerHTML='<div class="empty">Нет истории стадий</div>';return;}
  const W=980,lbl=130,pad=16;
  let t0=Infinity,t1=-Infinity;
  segs.forEach(s=>{t0=Math.min(t0,s.start);t1=Math.max(t1,s.end);});
  const now=Date.now();t1=Math.max(t1,now);t0=Math.min(t0,now-14*864e5);
  const span=Math.max(t1-t0,1);
  const X=t=>lbl+(t-t0)/span*(W-lbl-pad);
  const H=segs.length*34+20;
  let g='';
  const xt=X(now);
  g+='<line x1="'+xt+'" y1="4" x2="'+xt+'" y2="'+(H-6)+'" stroke="var(--danger)" stroke-dasharray="4 3"/><text x="'+(xt+4)+'" y="14" font-size="10" fill="var(--danger)">сегодня</text>';
  segs.forEach((s,i)=>{
    const y=i*34+10;const x1=X(s.start),x2=X(s.end),w=Math.max(x2-x1,4);
    g+='<text x="4" y="'+(y+13)+'" font-size="11" fill="var(--ink2)">'+esc(fmtD(s.start))+'</text>';
    g+='<rect x="'+x1+'" y="'+y+'" width="'+w+'" height="20" rx="6" fill="'+(STAGE_COLOR[s.stage]||'#888')+'" opacity="0.85"><title>'+esc(s.name)+'</title></rect>';
    if(w>60)g+='<text x="'+(x1+6)+'" y="'+(y+14)+'" font-size="10" fill="#fff" style="pointer-events:none">'+esc(s.name.slice(0,Math.floor(w/6.5)))+'</text>';
  });
  wrap.innerHTML='<div class="chartbox"><svg viewBox="0 0 '+W+' '+H+'" width="100%">'+g+'</svg></div>';
}

async function addPhotoFiles(files){
  const b=cur();if(!b||!files||!files.length)return;
  const cat=$('#photo-cat')?$('#photo-cat').value:'other';
  for(const f of files){
    if(!f.type.startsWith('image/'))continue;
    const ph={id:uid(),cat,file:'',note:'',ts:iso()};
    if(ST.mode==='fs'&&ST.dirHandle){
      try{
        const pix=await ST.dirHandle.getDirectoryHandle('pix',{create:true});
        const bdir=await pix.getDirectoryHandle(b.code,{create:true});
        const fname=b.code+'_'+Date.now()+'_'+f.name.replace(/[^\w.\-]/g,'_');
        const fh=await bdir.getFileHandle(fname,{create:true});
        const w=await fh.createWritable();await w.write(f);await w.close();
        ph.file=fname;ph.dir=b.code;
      }catch(e){toast('Не удалось записать фото в pix/ — сохранено во внутреннее хранилище','warn');await idb.set('photos',ph.id,f);}
    }else{
      await idb.set('photos',ph.id,f);
    }
    b.photos.push(ph);
  }
  logB(b,'Добавлено фото: '+files.length);markDirty();render();populatePhotos();
}
async function populatePhotos(){
  const b=cur();const grid=$('#photo-grid');if(!grid||!b)return;
  grid.innerHTML=b.photos.length?'':'<p class="hint">Фото пока нет.</p>';
  b.photos.forEach(ph=>{
    const d=document.createElement('div');d.className='ph';
    d.innerHTML='<span class="pc chip">'+esc(PHOTO_CATS[ph.cat]||ph.cat)+'</span>'+
    '<button class="pdel ibtn" data-action="photo-del" data-id="'+ph.id+'" aria-label="Удалить фото">'+icon('x')+'</button>'+
    '<img alt="'+esc(ph.cat)+'" data-phid="'+ph.id+'"><div class="pnote">'+esc(ph.note||fmtD(ph.ts))+'</div>';
    grid.appendChild(d);
    getPhotoURL(ph).then(url=>{const img=d.querySelector('img');if(img&&url)img.src=url;});
  });
}
async function getPhotoURL(ph){
  if(ST.photoURLs.has(ph.id))return ST.photoURLs.get(ph.id);
  let url=null;
  try{
    if(ph.file&&ST.mode==='fs'&&ST.dirHandle){
      const fh=await (await ST.dirHandle.getDirectoryHandle('pix')).getDirectoryHandle(ph.dir).getFileHandle(ph.file);
      url=URL.createObjectURL(await fh.getFile());
    }else{
      const f=await idb.get('photos',ph.id);
      if(f)url=URL.createObjectURL(f);
    }
  }catch(e){}
  if(url)ST.photoURLs.set(ph.id,url);
  return url;
}

  const csv='\ufeff'+[head,...rows].map(r=>r.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');
