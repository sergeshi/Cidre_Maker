/* ---------- 20. ТЕСТЫ ---------- */
function runTests(){
  const R=[];const T=(name,pass,detail)=>R.push({name,pass:!!pass,detail:detail||''});
  // 1-3: создание
  const bc=batchDefaults({name:'T',type:'classic'});T('Test 1: создание Classic',bc.id&&bc.status==='plan');
  const bp=batchDefaults({name:'T',type:'petnat'});T('Test 2: создание Pet-Nat',bp.type==='petnat');
  const tk={id:uid(),name:'S',startedAt:todayISO(),initialVolume:'100',currentVolume:'100',maxVolume:'120',operations:[]};
  T('Test 3: создание Solera',getSafe(()=>calculateSolera(tk).extra.volume===100));
  // 4-6: конверсии
  T('Test 4: ввод Brix → SG',Math.abs(brixToSG(12)-1.0484)<0.002,'SG='+brixToSG(12).toFixed(4));
  T('Test 5: ввод SG → Brix',Math.abs(sgToBrix(1.0484)-12)<0.2,'Brix='+sgToBrix(1.0484).toFixed(2));
  const r6=calculateResidualSugar({rb:'8.7',sg:'1.018',abv:'5.2'});T('Test 6: Brix+SG+ABV → RS',r6.value!=null&&r6.confidence==='medium','RS≈'+r6.value?.toFixed(0)+' г/л');
  // 7: коррекция рефрактометра
  const r7=calculateRefractometerCorrection({rb:8.7,abv:5.2});
  T('Test 7: коррекция рефрактометра',r7.result.extra.trueBrix<8.7&&r7.result.confidence==='medium','E='+r7.result.extra.trueBrix?.toFixed(2)+' °Bx');
  // 8: обратный Pet-Nat
  const r8=calculateTargetSugar({targetBar:3,temp:18});
  T('Test 8: обратный расчёт Pet-Nat',r8.value>8&&r8.value<18,'≈'+r8.value.toFixed(1)+' г/л при 3 bar/18°C');
  // 9: ликёр
  const r9=calculateLiqueur({volumeL:50,targetRS:12,currentRS:9.6,concGL:500});
  T('Test 9: расчёт ликёра',Math.abs(r9.value-0.24)<0.001,'V='+(r9.value*1000)+' мл');
  // 10: смена типа
  const b10=batchDefaults({name:'T',type:'petnat'});b10.petnat.targetBar='3';b10.measurements.push({id:uid(),date:todayISO(),brix:'8'});
  b10.archivedTypeData.petnat=b10.petnat;b10.type='classic';b10.typeChangeHistory.push({from:'petnat',to:'classic',date:iso(),user:'t'});
  T('Test 10: изменение типа партии',b10.measurements.length===1&&b10.typeChangeHistory.length===1&&b10.archivedTypeData.petnat.targetBar==='3');
  // 11-12: дубликаты
  const d1=batchDefaults(b10);d1.id=uid();d1.measurements=clone(b10.measurements);
  T('Test 11: Duplicate',d1.id!==b10.id&&d1.measurements.length===1);
  const d2=batchDefaults({type:b10.type,liqueur:clone(b10.liqueur)});d2.measurements=[];d2.operations=[];d2.history=[];
  T('Test 12: Create from template',d2.measurements.length===0&&d2.liqueur===b10.liqueur?true:d2.measurements.length===0);
  // 13: автосохранение (флаг)
  ST.dirty=false;markDirty();T('Test 13: автосохранение (debounce-флаг)',ST.dirty===true);clearTimeout(autoT);ST.dirty=false;
  // 14: повторная загрузка JSON
  getSafeAsync(async()=>{const j=JSON.stringify(batchDefaults({name:'X'}));const d=JSON.parse(j);return d.name==='X';}).then(v=>T('Test 14: сериализация/загрузка JSON',v));
  T('Test 14b: parse→migrate',getSafe(()=>{const d=migrateDataSync({schemaVersion:'1.0',batches:[{name:'A'}]});return d.schemaVersion==='2.3'&&d.batches[0].measurements;})===true);
  // 15: повреждённый JSON
  let threw=false;try{JSON.parse('{oops');}catch(e){threw=true;}
  T('Test 15: повреждённый JSON распознаётся',threw);
  // 16: timeline
  const b16=batchDefaults({name:'T'});b16.stageHistory=[{stage:'plan',date:'2026-01-01'},{stage:'primary',date:'2026-01-05'}];
  T('Test 16: Timeline (сегменты)',buildStageSegments(b16).length===2);
  // 17: solera transfer
  const tk2={id:uid(),name:'S2',startedAt:'2026-01-01',initialVolume:'100',currentVolume:'100',maxVolume:'120',operations:[
    {id:uid(),date:'2026-02-01',type:'both',draw:'20',fill:'20',sourceOldFraction:'0',age:'0'}]};
  const rs17=calculateSolera(tk2);
  T('Test 17: Solera transfer',Math.abs(rs17.extra.volume-100)<0.01&&rs17.extra.oldFraction<1&&rs17.extra.cycles===1,'F='+(rs17.extra.oldFraction*100).toFixed(0)+'%');
  // 18: неверные даты
  const b18=batchDefaults({name:'T',pressDate:'2026-05-01'});b18.measurements.push({id:uid(),date:'2026-04-01'});
  T('Test 18: неверные даты (измерение раньше прессования)',validateBatch(b18).some(v=>v.level==='error'));
  // 19: отрицательный объём
  const b19=batchDefaults({name:'T',volumeCurrent:'-5'});
  T('Test 19: отрицательный объём',validateBatch(b19).some(v=>v.level==='error'));
  // 20: опасное давление
  const r20=calculatePressure({sugarGL:100,temp:20,bottleLimit:6});
  T('Test 20: опасное давление (>предела бутылки)',r20.danger===true,'P≈'+r20.value.toFixed(1)+' bar');
  // рендер
  const ok=R.filter(x=>x.pass).length;
  openModal('<div class="mhead"><h3>Диагностика: '+ok+'/'+R.length+' пройдено</h3><button class="ibtn" data-action="modal-close" aria-label="Закрыть">'+icon('x')+'</button></div>'+
  '<div class="warnlist">'+R.map(r=>'<div class="wi"><span style="color:var(--'+(r.pass?'ok':'danger')+')">'+icon(r.pass?'check':'x')+'</span><span><b>'+esc(r.name)+'</b>'+(r.detail?' — <span class="mono small">'+esc(r.detail)+'</span>':'')+'</span></div>').join('')+'</div>'+
  '<div class="mfoot"><button class="btn primary" data-action="modal-close">Закрыть</button></div>');
  return R;
}
function getSafe(fn){try{return fn()}catch(e){return false}}
async function getSafeAsync(fn){try{return await fn()}catch(e){return false}}
function migrateDataSync(data){ // синхронная обёртка для теста (без бэкапа)
  let v=String(data.schemaVersion||'1.0');const order=['1.0','1.1','2.0','2.1','2.2','2.3'];let steps=0;
  while(v!==SCHEMA_VERSION&&MIGRATIONS[v]&&steps<10){data=MIGRATIONS[v](clone(data));v=data.schemaVersion;steps++;}
  normalizeDB(data);return data;
}

document.addEventListener('input',e=>{
  const t=e.target;
  if(t.matches('[data-bind]')){
    const p=t.dataset.bind;let v=t.type==='checkbox'?t.checked:t.value;
    if(p.startsWith('b.')){const b=cur();if(b){const key=p.slice(2);
      if(key==='status'){setStage(b,t.value);}
      else if(key==='soleraId'){b.soleraId=v;}
      else setPath(b,key,v);
      markDirty();updateLive();}}
    else if(p.startsWith('db.')){setPath(DB,p.slice(3),v);markDirty();updateLive();}
    else if(p.startsWith('sol.')){const rest=p.slice(4);const i=rest.indexOf('.');const tk=getTank(rest.slice(0,i));if(tk){setPath(tk,rest.slice(i+1),v);markDirty();updateLive();}}
  }
  else if(t.matches('[data-calcin]')){
    const b=cur();
    if(t.dataset.pn&&b){b.petnat[t.dataset.pn]=t.value;
      if(t.dataset.pn==='bottleType'){const pr=BOTTLE_PRESETS.find(x=>x.id===t.value);if(pr&&pr.id!=='custom'){b.petnat.bottleLimit=pr.limit;if(!b.petnat.temp)b.petnat.temp='';}}}
    if(t.dataset.lq&&b){b.liqueur[t.dataset.lq]=t.value;}
    if(t.dataset.dos){/* читается в LIVE напрямую */}
    markDirty();updateLive();
  }
  else if(t.matches('[data-filter]')){
    const k=t.dataset.filter;
    if(k==='q')VS.mf.q=t.value;
    if(k==='type')VS.mf.type=t.value;
    if(k==='status')VS.mf.status=t.value;
    if(k==='attention')VS.mf.attention=t.checked;
    if(k==='sort')VS.mf.sort=t.value;
    if(k==='mtq')VS.mt.q=t.value;
    if(k==='mtmethod')VS.mt.method=t.value;
    if(k==='mtstage')VS.mt.stage=t.value;
    const g=$('#dash-grid');if(g&&['q','type','status','attention','sort'].includes(k))g.innerHTML=dashGridHTML();
    const mt=$('#meas-table');if(mt&&['mtq','mtmethod','mtstage'].includes(k)){const b=cur();mt.innerHTML=measTableHTML(b);}
  }
  else if(t.matches('[data-chart]')){VS.chart[t.dataset.chart]=t.checked;const fc=$('#ferm-chart');if(fc)fc.innerHTML=fermChartSVG();}
});
