<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Recipemaker v1.1 — Конструктор рецептов сидра</title>
<style>
:root{
  --bg:#0f1419; --panel:#1a2028; --panel2:#232b36; --border:#2d3642;
  --accent:#d4a24c; --accent2:#8fb26a; --danger:#c0504d; --text:#e8e6e1;
  --muted:#8a94a3; --good:#6fb98f; --warn:#e0a45c;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:14px}
h1,h2,h3{margin:0 0 10px}
h1{color:var(--accent);font-size:22px}
h2{color:var(--accent);font-size:16px;border-bottom:1px solid var(--border);padding-bottom:6px;margin-top:18px}
h3{color:var(--accent2);font-size:14px;margin-top:10px}
.topbar{background:var(--panel);padding:12px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.topbar h1{margin:0;margin-right:auto}
button{background:var(--panel2);color:var(--text);border:1px solid var(--border);padding:7px 13px;border-radius:6px;cursor:pointer;font-size:13px;transition:.15s}
button:hover{background:var(--border);border-color:var(--accent)}
button.primary{background:var(--accent);color:#1a1a1a;border-color:var(--accent);font-weight:600}
button.primary:hover{background:#e5b35d}
button.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
button.small{padding:4px 9px;font-size:12px}
.container{display:grid;grid-template-columns:320px 1fr;gap:0;min-height:calc(100vh - 60px)}
.sidebar{background:var(--panel);border-right:1px solid var(--border);padding:14px;overflow-y:auto;max-height:calc(100vh - 60px)}
.main{padding:18px;overflow-y:auto;max-height:calc(100vh - 60px)}
.search{width:100%;padding:7px 10px;background:var(--panel2);border:1px solid var(--border);border-radius:6px;color:var(--text);margin-bottom:10px}
.recipe-list{display:flex;flex-direction:column;gap:6px}
.recipe-item{background:var(--panel2);padding:10px;border-radius:6px;border:1px solid var(--border);cursor:pointer;transition:.15s}
.recipe-item:hover{border-color:var(--accent)}
.recipe-item.active{border-color:var(--accent);background:#2a3340}
.recipe-item .name{font-weight:600;color:var(--accent)}
.recipe-item .meta{font-size:11px;color:var(--muted);margin-top:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:12px;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--panel2);border:1px solid var(--border);border-radius:5px;padding:6px 9px;color:var(--text);font-size:13px;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent)}
.field textarea{resize:vertical;min-height:60px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:14px;margin-bottom:14px}
.addon-row,.yeast-row{background:var(--panel2);padding:10px;border-radius:6px;margin-bottom:8px;border:1px solid var(--border);display:grid;gap:8px}
.addon-row{grid-template-columns:140px 1fr 100px 120px 30px}
.yeast-row{grid-template-columns:1fr 80px 80px 30px;align-items:center}
.score-bar{height:8px;background:var(--border);border-radius:4px;overflow:hidden;margin-top:4px}
.score-fill{height:100%;background:linear-gradient(90deg,var(--warn),var(--good));transition:.3s}
.tag{display:inline-block;background:var(--panel2);border:1px solid var(--border);padding:2px 8px;border-radius:10px;font-size:11px;margin:2px;color:var(--accent2)}
.tag.hot{background:#3a2a1a;color:var(--warn);border-color:#5a3a1a}
.suggestion{background:linear-gradient(135deg,#1f2a20,#1a2028);border:1px solid var(--accent2);border-radius:8px;padding:12px;margin-top:10px}
.suggestion h3{color:var(--accent2);margin:0 0 6px}
.empty{color:var(--muted);text-align:center;padding:40px 20px;font-style:italic}
.yeast-card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;transition:.2s}
.yeast-card.top1{border-color:var(--accent);background:#2a2518}
.yeast-card.top2{border-color:var(--accent2)}
.yeast-card.top3{border-color:#6fb9df}
.yeast-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.yeast-name{font-weight:600;color:var(--accent);font-size:15px}
.yeast-score{font-size:18px;font-weight:700;color:var(--good)}
.yeast-reason{font-size:12px;color:var(--muted);margin:4px 0}
.yeast-specs{font-size:12px;color:var(--text);margin-top:6px;line-height:1.5}
details{margin-top:8px}
details summary{cursor:pointer;color:var(--accent);font-size:12px}
details[open] summary{margin-bottom:6px}
.hint{background:#1a2028;border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;font-size:12px;color:var(--muted);border-radius:0 6px 6px 0}
.status{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:600}
.status.draft{background:#3a3020;color:var(--warn)}
.status.final{background:#1f3a20;color:var(--good)}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.tab{padding:8px 14px;cursor:pointer;border-bottom:2px solid transparent;color:var(--muted);font-size:13px}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tech-step{background:var(--panel2);padding:10px;border-radius:6px;margin-bottom:6px;border-left:3px solid var(--accent2)}
.tech-step b{color:var(--accent)}
@media(max-width:900px){.container{grid-template-columns:1fr}.sidebar{max-height:none}}
</style>
</head>
<body>

<div class="topbar">
  <h1>🍎 Recipemaker v1.1</h1>
  <span id="storageStatus" style="color:var(--muted);font-size:12px">Хранилище: загрузка…</span>
  <button onclick="newRecipe()">➕ Новый рецепт</button>
  <button onclick="document.getElementById('importFile').click()">📂 Импорт JSON</button>
  <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
  <button onclick="exportJSON()">📋 Экспорт JSON</button>
  <button onclick="chooseFolder()">📁 Выбрать папку</button>
  <button id="unlinkBtn" onclick="unlinkFolder()" style="display:none">✕ Отвязать папку</button>
  <button class="danger" onclick="resetAll()">↺ Сбросить всё</button>
</div>

<div class="container">
  <div class="sidebar">
    <h2>📜 Мои рецепты</h2>
    <input type="text" class="search" id="searchInput" placeholder="🔍 Поиск" oninput="renderList()">
    <select class="search" id="filterStyle" onchange="renderList()">
      <option value="">Все стили</option>
      <option value="classic">Классик</option>
      <option value="petnat">Петнат</option>
      <option value="still">Тихий</option>
      <option value="solera">Коль Фандо</option>
      <option value="ice">Ледяной</option>
      <option value="fruit">Фруктовый</option>
    </select>
    <div class="recipe-list" id="recipeList"></div>
  </div>

  <div class="main" id="mainArea">
    <div class="empty">Выберите рецепт или создайте новый</div>
  </div>
</div>

const ADDON_TYPES = {
  juice:{name:"Сок (не яблоко)",icon:"🧃",units:"л",examples:["грушевый","вишнёвый","малиновый","смородиновый","облепиховый","клюквенный","арония","виноградный"]},
  puree:{name:"Пюре / мезга",icon:"🍓",units:"кг",examples:["клубника","малина","черника","смородина","вишня","слива","айва"]},
  berry:{name:"Ягоды целые",icon:"🫐",units:"кг",examples:["малина","ежевика","черника","смородина","облепиха","шиповник"]},
  hop:{name:"Хмель",icon:"🌿",units:"г",examples:["Citra","Mosaic","Cascade","Saaz","Hallertau"]},
  oak:{name:"Дуб",icon:"🪵",units:"г",examples:["чипсы лёгкие","чипсы средние","чипсы тяжёлые","кубик французский","кубик американский","спираль"]},
  spice:{name:"Специи",icon:"🌶️",units:"г",examples:["корица","гвоздика","бадьян","имбирь","кардамон","ваниль","перец"]},
  sugar:{name:"Сахар / мёд",icon:"🍯",units:"г",examples:["сахар","мёд","декстроза","фруктоза","концентрат"]},
  acid:{name:"Кислота",icon:"🍋",units:"г",examples:["яблочная","лимонная","виннокаменная"]},
  other:{name:"Другое",icon:"🧪",units:"г",examples:[]}
};

/* ============ СОСТОЯНИЕ ============ */
let recipes = [];
let currentId = null;
let dirHandle = null;
let fileHandle = null;
const LS_KEY = "recipemaker_recipes_v1";

/* ============ УТИЛИТЫ ============ */
function escapeHtml(s){
  return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function updateStorageStatus(msg,ok=true){
  const el=document.getElementById('storageStatus');
  if(!el)return;
  el.textContent=msg;
  el.style.color=ok?'var(--muted)':'var(--danger)';
}

/* ============ ХРАНИЛИЩЕ ============ */
function loadFromLS(){
  try{
    const raw=localStorage.getItem(LS_KEY);
    if(raw){recipes=JSON.parse(raw)}
  }catch(e){recipes=[];console.error('LS load error',e)}
  updateStorageStatus('localStorage ✓ ('+recipes.length+')');
}

async function saveToLS(){
  try{
    localStorage.setItem(LS_KEY,JSON.stringify(recipes));
  }catch(e){console.error('LS save error',e)}
  if(dirHandle && fileHandle){
    try{
      const perm=await dirHandle.queryPermission({mode:'readwrite'});
      if(perm==='granted'){
        const w=await fileHandle.createWritable();
        await w.write(JSON.stringify(recipes,null,1));
        await w.close();
        updateStorageStatus('📁 '+dirHandle.name+' ✓');
      }
    }catch(e){updateStorageStatus('Ошибка записи в файл',false);console.error(e)}
  }
}

async function chooseFolder(){
  if(!window.showDirectoryPicker){alert('Браузер не поддерживает File System Access');return}
  try{
    dirHandle=await window.showDirectoryPicker({mode:'readwrite'});
    fileHandle=await dirHandle.getFileHandle('recipes.json',{create:true});
    document.getElementById('unlinkBtn').style.display='inline-block';
    const file=await fileHandle.getFile();
    if(file.size>0){
      const text=await file.text();
      try{
        const data=JSON.parse(text);
        if(Array.isArray(data)){
          if(confirm('Заменить текущие рецепты ('+recipes.length+') на '+data.length+' из файла?\n\nOK = заменить\nОтмена = добавить к текущим')){
            recipes=data;
          }else{
            recipes=recipes.concat(data);
          }
          await saveToLS();
          renderList();
        }
      }catch(e){console.error('parse error',e)}
    }
    updateStorageStatus('📁 '+dirHandle.name+' ✓');
  }catch(e){console.log('folder cancelled')}
}

function unlinkFolder(){
  dirHandle=null;fileHandle=null;
  document.getElementById('unlinkBtn').style.display='none';
  updateStorageStatus('localStorage ✓');
}

function importJSON(e){
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=ev=>{
    try{
      const data=JSON.parse(ev.target.result);
      if(Array.isArray(data)){
        if(confirm('Заменить текущие ('+recipes.length+') на импортируемые ('+data.length+')?\n\nOK = заменить\nОтмена = добавить')){
          recipes=data;
        }else{
          recipes=recipes.concat(data);
        }
        saveToLS();renderList();
        alert('Импортировано: '+data.length);
      }
    }catch(err){alert('Ошибка JSON: '+err.message)}
  };
  r.readAsText(f);
  e.target.value='';
}

function exportJSON(){
  const blob=new Blob([JSON.stringify(recipes,null,1)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='recipes.json';
  a.click();
}

function resetAll(){
  if(!confirm('Удалить ВСЕ рецепты?'))return;
  recipes=[];currentId=null;saveToLS();renderList();
  document.getElementById('mainArea').innerHTML='<div class="empty">Выберите рецепт или создайте новый</div>';
}

/* ============ РЕЦЕПТЫ ============ */
function newRecipe(){
  try{
    const id='R-'+Date.now()+'-'+Math.random().toString(36).slice(2,7);
    const today=new Date().toISOString().slice(0,10);
    const r={
      id:id,
      code:'',
      name:'Новый рецепт',
      emoji:'🍎',
      createdDate:today,
      status:'draft',
      base:{varieties:'',volume:20,brix:12,ph:3.5,ta:6,region:''},
      target:{style:'classic',sweetness:'dry',abv:6,carbonation:3,character:'balanced'},
      addons:[],
      tech:{maceration:false,macerationDays:0,coldSoak:false,fermTemp:18,fermDays:21,surLie:false,oakAging:false,oakMonths:0,blend:false},
      yeast:[],
      nutrients:'DAP 20 г/10л + Fermaid O 20 г/10л',
      notes:'',
      suggestions:{style:'',technology:[],yeast:[],warnings:[]}
    };
    recipes.push(r);
    currentId=id;
    saveToLS();
    renderList();
    renderEditor();
    recalcSuggestions();
    renderEditor(); // перерисовать после подсчёта
  }catch(e){
    alert('Ошибка создания: '+e.message);
    console.error(e);
  }
}

function deleteRecipe(){
  if(!currentId)return;
  if(!confirm('Удалить рецепт?'))return;
  recipes=recipes.filter(r=>r.id!==currentId);
  currentId=null;saveToLS();renderList();
  document.getElementById('mainArea').innerHTML='<div class="empty">Выберите рецепт или создайте новый</div>';
}

function selectRecipe(id){
  currentId=id;
  renderList();
  renderEditor();
}

function currentRecipe(){return recipes.find(r=>r.id===currentId)}

/* ============ СПИСОК ============ */
function renderList(){
  const q=(document.getElementById('searchInput').value||'').toLowerCase();
  const f=document.getElementById('filterStyle').value;
  const list=document.getElementById('recipeList');
  const filtered=recipes.filter(r=>{
    const matchQ=!q||r.name.toLowerCase().includes(q)||(r.code||'').toLowerCase().includes(q);
    const matchF=!f||r.target.style===f;
    return matchQ&&matchF;
  }).sort((a,b)=>(b.createdDate||'').localeCompare(a.createdDate||''));
  if(!filtered.length){list.innerHTML='<div class="empty">Нет рецептов</div>';return}
  const styleNames={classic:'Классик',petnat:'Петнат',still:'Тихий',solera:'Solera',ice:'Ледяной',fruit:'Фруктовый'};
  list.innerHTML=filtered.map(r=>{
    const styleName=styleNames[r.target.style]||r.target.style||'?';
    return '<div class="recipe-item '+(r.id===currentId?'active':'')+'" onclick="selectRecipe(\''+r.id+'\')">'+
      '<div class="name">'+(r.emoji||'🍎')+' '+escapeHtml(r.name)+'</div>'+
      '<div class="meta">'+(r.code?r.code+' · ':'')+styleName+' · '+r.base.volume+'л · '+r.base.brix+'°Bx</div>'+
      '<div class="meta"><span class="status '+(r.status||'draft')+'">'+(r.status==='final'?'✅ финал':'📝 черновик')+'</span> '+(r.createdDate||'')+'</div>'+
    '</div>';
  }).join('');
}

/* ============ ЛОГИКА ПОДБОРА ============ */
function recalcSuggestions(){
  const r=currentRecipe();
  if(!r)return;
  const b=r.base,t=r.target,tc=r.tech;
  const addons=r.addons||[];
  const hasBerry=addons.some(a=>['berry','puree'].includes(a.type));
  const hasJuice=addons.some(a=>a.type==='juice');
  const hasHop=addons.some(a=>a.type==='hop');
  const hasOak=addons.some(a=>a.type==='oak')||tc.oakAging;
  const hasSpice=addons.some(a=>a.type==='spice');
  const hasSugar=addons.some(a=>a.type==='sugar');
  const highAcid=(b.ta>7||b.ph<3.3);
  const lowAcid=(b.ta<4||b.ph>3.8);
  const targetAbv=t.abv||(b.brix*0.55);
  const highAbv=targetAbv>12;
  const sparkling=t.carbonation>=4;
  const coldFerm=tc.fermTemp<16;
  const warmFerm=tc.fermTemp>24;

  const scored=YEAST_DB.map(y=>{
    let score=50;
    const reasons=[];
    if(y.bestFor.includes(t.style)){score+=15;reasons.push('✓ стиль '+t.style)}
    if(t.style==='petnat'&&y.strengths.includes('sparkling')){score+=10;reasons.push('✓ для игристого')}
    if(t.style==='ice'&&(y.abvMax>=16||y.strengths.includes('high_abv'))){score+=10;reasons.push('✓ высокий алкоголь')}
    if(t.style==='fruit'&&(y.style==='fruity'||y.style==='tropical'||y.style==='aromatic')){score+=12;reasons.push('✓ фруктовый профиль')}
    if(t.style==='classic'&&y.style==='classic_cider'){score+=15;reasons.push('✓ классический сидровый')}
    if(t.style==='still'&&y.bestFor.includes('still'))score+=5;

    if(t.character==='fruity'&&(y.strengths.includes('fruity')||y.strengths.includes('aromatic'))){score+=10;reasons.push('✓ фруктовость')}
    if(t.character==='floral'&&y.aroma.includes('flowers')){score+=10;reasons.push('✓ цветочный')}
    if(t.character==='mineral'&&y.neutral){score+=8;reasons.push('✓ нейтральный — раскроет минерал')}
    if(t.character==='creamy'&&y.strengths.includes('body')){score+=12;reasons.push('✓ тело / кремовость')}
    if(t.character==='winey'&&(y.style==='full_body'||y.style==='red_full')){score+=10;reasons.push('✓ винный стиль')}
    if(t.character==='tannic'&&hasOak&&y.strengths.includes('oak')){score+=10;reasons.push('✓ для дуба')}

    if(hasBerry&&y.bestFor.includes('berry_blend')){score+=15;reasons.push('✓ под ягодные добавки')}
    if(hasBerry&&y.style.startsWith('red')){score+=10;reasons.push('✓ красный профиль под ягоды')}
    if(hasHop&&(y.style==='tropical'||y.aroma.includes('passionfruit')||y.aroma.includes('grapefruit'))){score+=12;reasons.push('✓ под хмель')}
    if(hasOak&&y.strengths.includes('oak')){score+=10;reasons.push('✓ совместим с дубом')}
    if(hasOak&&y.strengths.includes('sur_lie'))score+=5;
    if(hasSpice&&y.neutral){score+=5;reasons.push('✓ нейтральный — не конфликтует со специями')}
    if(hasSugar&&y.strengths.includes('high_sugar')){score+=8;reasons.push('✓ переносит высокий сахар')}

    if(highAcid&&y.strengths.includes('malic_reduction')){score+=12;reasons.push('✓ снижает яблочную кислоту')}
    if(highAcid&&y.strengths.includes('soft'))score+=5;
    if(highAbv&&y.abvMax>=targetAbv){score+=10;reasons.push('✓ выдержит '+targetAbv.toFixed(1)+'%')}
    if(highAbv&&y.abvMax<targetAbv){score-=20;reasons.push('✗ не хватит спиртоустойчивости')}
    if(coldFerm&&y.tempMin<=coldFerm&&y.strengths.includes('cold')){score+=8;reasons.push('✓ холодное брожение')}
    if(coldFerm&&y.tempMin>coldFerm){score-=10;reasons.push('✗ слишком теплолюбив')}
    if(warmFerm&&y.tempMax>=warmFerm)score+=3;
    if(sparkling&&y.strengths.includes('sparkling')){score+=10;reasons.push('✓ для бутылочной ферментации')}
    if(sparkling&&y.strengths.includes('not_sparkling')){score-=15;reasons.push('✗ не для игристого')}
    if(tc.surLie&&y.strengths.includes('sur_lie')){score+=10;reasons.push('✓ для выдержки на осадке')}

    if(t.style==='classic'&&y.style.startsWith('red')){score-=20;reasons.push('✗ красный штамм для классики')}
    if(t.style==='classic'&&y.style==='tropical'){score-=10;reasons.push('✗ тропики не для классики')}

    score=Math.max(5,Math.min(99,score));
    return {name:y.name,score:Math.round(score),reason:reasons.slice(0,4).join(' · ')||'универсальный вариант'};
  });
  scored.sort((a,b)=>b.score-a.score);

  let styleSuggest='';
  if(hasBerry)styleSuggest='Ягодно-яблочный купаж — рассмотрите стиль fruit или красный сидр';
  else if(hasHop)styleSuggest='Хмелевой сидр (hopped cider) — современный craft стиль';
  else if(hasOak||tc.oakAging)styleSuggest='Выдержанный гастрономический сидр в винном стиле';
  else if(t.style==='petnat')styleSuggest='Петнат — естественная карбонизация, дображивание в бутылке';
  else if(t.style==='ice')styleSuggest='Ледяной сидр — высокая сахаристость, долгая ферментация';
  else if(t.style==='solera')styleSuggest='Коль Фандо (Solera) — многослойная выдержка';
  else if(t.character==='winey')styleSuggest='Сидр в стиле белого/красного вина — премиальный';
  else styleSuggest='Классический яблочный сидр — чистый сортовой профиль';

  const techSuggest=[];
  if(tc.maceration)techSuggest.push('<b>Мацерация:</b> '+((tc.macerationDays||2))+' дней при 8–10°C для экстракции аромата');
  if(tc.coldSoak)techSuggest.push('<b>Cold soak:</b> 24–48 часов при 4–8°C перед брожением');
  if(coldFerm)techSuggest.push('<b>Холодная ферментация:</b> '+tc.fermTemp+'°C — медленная, для сохранения ароматики');
  else if(warmFerm)techSuggest.push('<b>Тёплая ферментация:</b> '+tc.fermTemp+'°C — быстрая, для полноты тела');
  else techSuggest.push('<b>Ферментация:</b> '+tc.fermTemp+'°C, '+tc.fermDays+' дней');
  if(tc.surLie)techSuggest.push('<b>Sur Lie:</b> выдержка на осадке 3–6 месяцев с баттонажем');
  if(tc.oakAging)techSuggest.push('<b>Дуб:</b> '+((tc.oakMonths||3))+' месяцев, лёгкие/средние чипсы 2–4 г/л');
  if(sparkling&&t.style==='petnat')techSuggest.push('<b>Петнат:</b> розлив при 30–40 г/л остаточного сахара, кронен-пробка');
  if(sparkling&&t.style==='classic')techSuggest.push('<b>Классический метод:</b> тиражный ликёр 24 г/л + 6 г/л дрожжей, выдержка на осадке 6+ мес');
  if(hasBerry)techSuggest.push('<b>Ягоды:</b> внесение на 2–3 день брожения или мацерация 5–7 дней');
  if(hasHop)techSuggest.push('<b>Хмель:</b> холодное охмеление 3–5 г/л, 3–5 дней после окончания брожения');
  if(hasOak&&!tc.oakAging)techSuggest.push('<b>Дуб:</b> внести на этапе брожения или выдержки, 2–4 г/л');

  const warnings=[];
  if(highAbv&&targetAbv>14)warnings.push('Высокая целевая крепость — нужны спиртоустойчивые дрожжи (EC-1118, BC S103, VR 44, K1-V1116)');
  if(highAcid)warnings.push('Высокая кислотность — рассмотрите 71B (снижает яблочную кислоту на 20–40%)');
  if(b.brix<10)warnings.push('Низкий Brix — возможно потребуется шаптализация или ледяной метод');
  if(hasSugar&&t.sweetness!=='dry')warnings.push('Добавлен сахар + не сухой стиль — нужна стабилизация (сорбат + холод или пастеризация)');
  if(sparkling&&t.sweetness!=='dry')warnings.push('Игристое + не сухой стиль — нужен точный расчёт тиражного ликёра и дегоржаж');
  if(hasBerry&&t.style==='classic')warnings.push('Ягоды + классический стиль — ягоды изменят характер, рассмотрите стиль fruit');
  if(hasHop&&scored[0]&&scored[0].score<60)warnings.push('Хмель требует ароматических дрожжей (QA23, VIN13, X-5) для синергии');

  r.suggestions={style:styleSuggest,technology:techSuggest,yeast:scored,warnings:warnings};
  saveToLS();
}

/* ============ СТАРТ ============ */
loadFromLS();
renderList();
if(recipes.length){selectRecipe(recipes[0].id)}
</script>
